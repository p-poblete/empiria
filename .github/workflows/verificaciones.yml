name: Verificaciones

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          EMPIRIA_CAPTURAS: ${{ runner.temp }}/empiria-capturas
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-alpine
          path: ${{ runner.temp }}/empiria-capturas
          if-no-files-found: ignore
