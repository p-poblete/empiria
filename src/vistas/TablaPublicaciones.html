<!-- La sección contenedora define tipoPublicaciones: individual o carrera. -->
<table data-gestion="coleccion">
  <caption class="sr-only">Publicaciones filtradas</caption>
  <thead>
    <tr>
      <template x-for="columna in $store.reportes.tablas[tipoPublicaciones].columnas" :key="columna[0]">
        <th scope="col" :aria-sort="accionCabeceraColeccionInv(columna[0]) === 'orden' ? ($store.reportes.tablas[tipoPublicaciones].orden === columna[0] ? $store.reportes.tablas[tipoPublicaciones].direccion : 'none') : null">
          <span x-show="accionCabeceraColeccionInv(columna[0]) === 'lectura'" x-text="columna[1]"></span>
          <button x-show="accionCabeceraColeccionInv(columna[0]) !== 'lectura'" type="button" class="tabla-orden-boton" :class="{ 'inv-columna-filtrada': ($store.reportes.tablas[tipoPublicaciones].filtros[columna[0]] || []).length }" :data-columna="columna[0]" :aria-label="(accionCabeceraColeccionInv(columna[0]) === 'filtro' ? 'Filtrar por ' : 'Ordenar por ') + columna[1]" :aria-haspopup="accionCabeceraColeccionInv(columna[0]) === 'filtro' ? 'dialog' : null" @click="accionCabeceraColeccionInv(columna[0]) === 'filtro' ? abrirFiltroCabeceraInv(tipoPublicaciones, columna[0]) : ordenarColeccionInv(tipoPublicaciones, columna[0])">
            <span x-text="columna[1]"></span>
            <i x-show="accionCabeceraColeccionInv(columna[0]) === 'filtro'" class="fa-solid fa-filter" aria-hidden="true"></i>
            <span x-show="accionCabeceraColeccionInv(columna[0]) === 'orden'" aria-hidden="true" x-text="$store.reportes.tablas[tipoPublicaciones].orden === columna[0] ? ($store.reportes.tablas[tipoPublicaciones].direccion === 'ascending' ? '↑' : '↓') : '↕'"></span>
          </button>
        </th>
      </template>
      <th scope="col">Acciones</th>
    </tr>
  </thead>
  <tbody :id="tipoPublicaciones === 'publicaciones' ? 'tabla-publicaciones-body' : 'carrera-publicaciones-body'">
    <template x-for="fila in $store.reportes.tablas[tipoPublicaciones].filas" :key="fila.clave">
      <tr>
        <template x-for="columna in $store.reportes.tablas[tipoPublicaciones].columnas" :key="columna[0]">
          <!-- celdaColeccionInv escapa texto y valida enlaces antes de generar marcado. -->
          <td x-html="celdaColeccionInv(fila.item, columna[0])"></td>
        </template>
        <td class="inv-acciones-registro">
          <a x-show="urlReporte(fila.item.urlEvidencia)" :href="urlReporte(fila.item.urlEvidencia) || null" target="_blank" rel="noopener noreferrer">Ver evidencia ↗</a>
          <small x-show="!urlReporte(fila.item.urlEvidencia)">Sin evidencia adjunta</small>
        </td>
      </tr>
    </template>
    <tr x-show="!$store.reportes.tablas[tipoPublicaciones].filas.length"><td :colspan="$store.reportes.tablas[tipoPublicaciones].columnas.length + 1" class="reporte-vacio">No hay publicaciones que coincidan con la búsqueda y los filtros.</td></tr>
  </tbody>
</table>
