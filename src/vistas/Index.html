  <!-- Versión fija; defer permite registrar el store antes del inicio de Alpine. -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.17.5/dist/cdn.min.js"></script>
  <script>
    // Tema antes de pintar: preferencia guardada o, en su defecto, la del sistema.
    (function () {
      var tema = null;
      try { tema = localStorage.getItem('empiria-tema'); } catch (e) {}
      if (tema !== 'oscuro' && tema !== 'claro') tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.setAttribute('data-theme', tema === 'oscuro' ? 'dark' : 'light');
    })();
  </script>
