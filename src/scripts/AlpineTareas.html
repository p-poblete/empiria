<!-- Estado reactivo del módulo Tareas (CU-002). -->
<script>
  function formularioTareaInicial() {
    return { titulo: '', descripcion: '', fecha: '', hora: '23:59', plantillaId: '', hojaInicial: '', hojaFinal: '' };
  }

  document.addEventListener('alpine:init', function() {
    Alpine.store('tareas', {
      formulario: formularioTareaInicial(),
      plantillas: [], cargandoPlantillas: false, errorPlantillas: '', cicloCargado: '', solicitud: 0,
      publicando: false, cancelando: false, errorPublicacion: '', cicloCerrado: false,
      sesion: 'demo-' + crypto.randomUUID(),
      get disponibles() {
        return this.plantillas.filter(function(p) { return p.estado === 'disponible'; });
      },
      get ayudaHojas() {
        var id = this.formulario.plantillaId;
        var plantilla = this.plantillas.find(function(p) { return p.id === id; });
        return plantilla ? 'Hojas disponibles, en orden: ' + plantilla.hojas.join(' → ') + '. Puede seleccionar una sola hoja usando el mismo nombre en ambos extremos.' : 'Seleccione una plantilla para consultar sus hojas disponibles.';
      },
      cargarPlantillas: async function(forzar) {
        var ciclo = cicloReporte();
        if (!forzar && (this.cargandoPlantillas && this.cicloSolicitado === ciclo || this.cicloCargado === ciclo)) return;
        var solicitud = ++this.solicitud;
        this.cicloSolicitado = ciclo;
        this.cargandoPlantillas = true;
        this.errorPlantillas = '';
        try {
          var respuesta = await llamarServidor('obtenerPlantillasTarea', [ciclo]);
          if (solicitud !== this.solicitud) return;
          if (!respuesta || respuesta.ciclo !== ciclo || !Array.isArray(respuesta.plantillas) || respuesta.plantillas.some(function(p) { return !p || !p.id || !p.nombre || !Array.isArray(p.hojas); })) throw new Error('Catálogo de plantillas inválido.');
          // Mantiene las plantillas nuevas y las asociaciones de esta demostración.
          var locales = plantillas;
          plantillas = respuesta.plantillas.map(function(p) { return locales.find(function(local) { return local.id === p.id; }) || p; }).concat(locales.filter(function(p) { return p.creadaLocalmente && !respuesta.plantillas.some(function(remota) { return remota.id === p.id; }); }));
          this.cicloCargado = ciclo;
          actualizarSelectPlantillas();
          renderizarPlantillas();
        } catch (error) {
          if (solicitud === this.solicitud) this.errorPlantillas = String(error.message || error);
        } finally {
          if (solicitud === this.solicitud) this.cargandoPlantillas = false;
        }
      }
    });
  });
</script>
