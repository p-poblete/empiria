  // FIN: Renderizadores compartidos de gráficos

  // INICIO: Series temporales del reporte por carrera

  function seriesTemporalesCarrera(datos, temporalidad) {
    var periodos = Object.create(null);
    ['publicaciones', 'proyectos', 'eventos'].forEach(function(tipo) {
      datos[tipo].forEach(function(item) {
        var fecha = fechaRegistroGraficoCarrera(item, tipo);
        if (!fecha) return;
        var inicio = inicioPeriodoGraficoCarrera(fecha, temporalidad);
        var clave = inicio.toISOString().slice(0, 10);
        if (!periodos[clave]) periodos[clave] = { ciclo: etiquetaPeriodoGraficoCarrera(inicio, temporalidad), fecha: clave, publicaciones: 0, proyectos: 0, internos: 0, externos: 0, eventos: 0 };
        periodos[clave][tipo] += 1;
        if (tipo === 'proyectos' && item.tipo === 'Interno') periodos[clave].internos += 1;
        if (tipo === 'proyectos' && item.tipo === 'Externo') periodos[clave].externos += 1;
      });
    });
    var claves = Object.keys(periodos).sort();
    if (!claves.length) return [];
    var cursor = fechaGraficoCarrera(claves[0]);
    var fin = claves[claves.length - 1];
    var filas = [];
    // Los intervalos sin contribuciones se muestran en cero entre los registros fechados.
    while (cursor.toISOString().slice(0, 10) <= fin) {
      var clave = cursor.toISOString().slice(0, 10);
      filas.push(periodos[clave] || { ciclo: etiquetaPeriodoGraficoCarrera(cursor, temporalidad), fecha: clave, publicaciones: 0, proyectos: 0, internos: 0, externos: 0, eventos: 0 });
      if (temporalidad === 'mes') cursor.setUTCMonth(cursor.getUTCMonth() + 1);
      else cursor.setUTCDate(cursor.getUTCDate() + (temporalidad === 'semana' ? 7 : 1));
    }
    return filas;
  }

  function seriesCarreraReporte(datos, temporalidad) {
    if (['mes', 'semana', 'dia'].indexOf(temporalidad) !== -1) return seriesTemporalesCarrera(datos, temporalidad);
    var ciclos = [];
    ['publicaciones', 'proyectos', 'eventos'].forEach(function(campo) {
      datos[campo].forEach(function(item) { ciclos.push(item.ciclo || 'Sin ciclo registrado'); });
    });
    return unicosReporte(ciclos).map(function(ciclo) {
      var proyectos = datos.proyectos.filter(function(item) { return (item.ciclo || 'Sin ciclo registrado') === ciclo; });
      return { ciclo: ciclo,
        publicaciones: datos.publicaciones.filter(function(item) { return (item.ciclo || 'Sin ciclo registrado') === ciclo; }).length,
        proyectos: proyectos.length,
        internos: proyectos.filter(function(item) { return item.tipo === 'Interno'; }).length,
        externos: proyectos.filter(function(item) { return item.tipo === 'Externo'; }).length,
        eventos: datos.eventos.filter(function(item) { return (item.ciclo || 'Sin ciclo registrado') === ciclo; }).length
      };
    });
  }

  function renderizarSeriesReporte(datos, seleccion, temporalidad) {
    var filas = seriesCarreraReporte(datos, temporalidad);
    if (!filas.length) { document.getElementById('carrera-series').innerHTML = '<p class="reporte-vacio">Sin contribuciones en los periodos seleccionados.</p>'; return; }
    var series = [['publicaciones', 'Publicaciones', 'var(--grafico-1)'], ['proyectos', 'Proyectos', 'var(--grafico-2)'], ['internos', 'Proyectos internos', 'var(--grafico-3)'], ['externos', 'Proyectos externos', 'var(--grafico-4)'], ['eventos', 'Eventos', 'var(--grafico-5)']];
    var respaldos = ['#0759A9', '#007B96', '#C18317', '#8058C3', '#276A8B'];
    series = series.map(function(serie, indice) { return [serie[0], serie[1], colorGraficoReporte(serie[2].slice(4, -1), respaldos[indice])]; });
    if (seleccion) series = series.filter(function(serie) { return seleccion.indexOf(serie[0]) !== -1; });
    if (!series.length) { document.getElementById('carrera-series').innerHTML = '<p class="reporte-vacio">Selecciona al menos un indicador en los filtros.</p>'; return; }
    var maximo = Math.max.apply(null, filas.reduce(function(valores, fila) { return valores.concat(series.map(function(serie) { return fila[serie[0]]; })); }, [1]));
    var marcas = [0, Math.ceil(maximo / 2), maximo].filter(function(valor, indice, valores) { return valores.indexOf(valor) === indice; });
    var ancho = Math.max(600, filas.length * 90);
    var intervaloEtiquetas = Math.max(1, Math.ceil(filas.length / Math.max(2, Math.floor((ancho - 128) / 115))));
    function x(indice) { return filas.length === 1 ? ancho / 2 : 64 + indice * (ancho - 128) / (filas.length - 1); }
    function y(valor) { return 110 - 90 * valor / maximo; }
    var svg = '<svg class="carrera-series-svg" preserveAspectRatio="xMinYMin meet" style="width:' + ancho + 'px" viewBox="0 0 ' + ancho + ' 146" role="img" aria-label="Evolución del número de publicaciones, proyectos internos y externos y eventos por ' + ({ mes: 'mes', semana: 'semana', dia: 'día' }[temporalidad] || 'ciclo') + '. Cada punto incluye su periodo, indicador y valor.">';
    svg += marcas.map(function(valor) { return '<line x1="64" y1="' + y(valor) + '" x2="' + (ancho - 64) + '" y2="' + y(valor) + '" stroke="' + colorGraficoReporte('--borde', '#D1DFEA') + '"/><text x="52" y="' + (y(valor) + 4) + '" text-anchor="end">' + valor + '</text>'; }).join('');
    svg += filas.map(function(fila, indice) { return indice % intervaloEtiquetas === 0 || indice === filas.length - 1 ? '<text x="' + x(indice) + '" y="132" text-anchor="middle">' + escaparReporte(fila.ciclo.replace('Ciclo ', '')) + '</text>' : ''; }).join('');
    svg += series.map(function(serie) {
      return '<polyline fill="none" stroke="' + serie[2] + '" stroke-width="2" points="' + filas.map(function(fila, indice) { return x(indice) + ',' + y(fila[serie[0]]); }).join(' ') + '"/>' + filas.map(function(fila, indice) {
        return '<circle cx="' + x(indice) + '" cy="' + y(fila[serie[0]]) + '" r="3" fill="' + serie[2] + '"><title>' + escaparReporte(fila.ciclo + ': ' + serie[1] + ' ' + fila[serie[0]]) + '</title></circle>';
      }).join('');
    }).join('') + '</svg>';
    var leyenda = '<ul class="carrera-series-leyenda">' + series.map(function(serie) { return '<li><span style="background:' + serie[2] + '" aria-hidden="true"></span>' + serie[1] + '</li>'; }).join('') + '</ul>';
    document.getElementById('carrera-series').innerHTML = svg + leyenda;
  }

  // FIN: Series temporales del reporte por carrera

  // INICIO: Preparación de la descarga por investigador

  function abrirDescargaInvestigador() {
    // FA-008 de CU-005: operación protegida; bloqueo por sesión inválida o expirada.
    if (typeof probarOperacionProtegida === 'function' && !probarOperacionProtegida()) return;
    if (!valorReporte('select-investigador')) {
      alert('Selecciona un investigador para descargar su reporte.');
      return;
    }
    textoReporte('inv-descarga-estado', 'Selecciona al menos una sección.');
    prepararElementosDescarga();
    document.getElementById('inv-dialogo-descarga').showModal();
  }

  function datosDescargaInvestigador(secciones) {
    var inv = investigadoresReporte().find(function(persona) { return persona.id === valorReporte('select-investigador'); });
    if (!inv) return null;
    var datos = datosPeriodoInvestigador(inv);
    var reporte = { titulo: 'Reporte por Investigador', generado: new Date().toISOString(), demostracion: true, secciones: {} };
    secciones.forEach(function(clave) {
      if (clave === 'dedicacion') reporte.secciones[clave] = { disponibilidad: inv.dias || [], tipo: inv.dedicacion, categoria: inv.categoria };
      if (clave === 'ficha') reporte.secciones[clave] = { id: inv.id, nombre: inv.nombre, dni: inv.dni, correo: inv.correo, carrera: inv.carrera, renacytCodigo: inv.renacytCodigo, renacytGrupo: inv.renacytGrupo, renacytNivel: inv.renacytNivel, ctivitae: urlReporte(inv.ctivitaeUrl), lineas: lineasInvestigador(inv) };
      if (clave === 'graficos') reporte.secciones[clave] = { calidadHIndex: calidadInvestigador(filtrarRegistrosInv(datos.publicaciones, 'pub')), proyectos: agruparReporte(filtrarRegistrosInv(datos.proyectos, 'pro'), 'estado') };
      if (clave === 'estadisticas') {
        reporte.secciones[clave] = { indicadores: [] };
        document.querySelectorAll('#inv-estadisticas .reporte-metrica').forEach(function(metrica) {
          reporte.secciones[clave].indicadores.push({ indicador: metrica.querySelector('span').textContent, valor: metrica.querySelector('strong').textContent });
        });
      }
      if (['publicaciones', 'proyectos', 'eventos'].indexOf(clave) !== -1) reporte.secciones[clave] = registrosColeccionInv(clave);
    });
    return reporte;
  }

  // FIN: Preparación de la descarga por investigador

  // INICIO: Serialización de reportes en CSV

  function csvDescargaInvestigador(reporte) {
    var filas = [['Sección', 'Registro', 'Campo', 'Valor']];
    function recorrer(valor, ruta, seccion, registro) {
      if (valor !== null && typeof valor === 'object') {
        Object.keys(valor).forEach(function(clave) { recorrer(valor[clave], ruta ? ruta + '.' + clave : clave, seccion, registro); });
      } else filas.push([seccion, registro, ruta, valor == null ? '' : valor]);
    }
    Object.keys(reporte.secciones).forEach(function(seccion) {
      var datos = reporte.secciones[seccion];
      if (Array.isArray(datos)) {
        if (!datos.length) filas.push([seccion, '', 'Estado', 'Sin registros']);
        datos.forEach(function(item, indice) { recorrer(item, '', seccion, indice + 1); });
      } else recorrer(datos, '', seccion, '');
    });
    return '\uFEFF' + filas.map(function(fila) {
      return fila.map(function(celda) {
        var texto = String(celda);
        // Evita interpretar texto exportado como fórmulas en hojas de cálculo.
        if (/^[=+@\-\t\r]/.test(texto)) texto = "'" + texto;
        return '"' + texto.replace(/"/g, '""') + '"';
      }).join(',');
    }).join('\r\n');
  }

  // FIN: Serialización de reportes en CSV

  // INICIO: Selección detallada de elementos para descarga

  function etiquetaDescarga(clave) {
    var etiquetas = { ficha: 'Ficha del investigador', dedicacion: 'Dedicación', estadisticas: 'Estadísticas', graficos: 'Gráficos', comparativas: 'Comparativas y rankings', investigadores: 'Investigadores', publicaciones: 'Publicaciones', proyectos: 'Proyectos', eventos: 'Eventos', kpis: 'Indicadores principales', produccion: 'Producción científica', series: 'Series temporales', calidadHIndex: 'Promedio de calidad (H-index)', renacytCodigo: 'Código RENACYT', renacytGrupo: 'Grupo RENACYT', renacytNivel: 'Nivel RENACYT', ctivitae: 'CTI Vitae', dni: 'DNI', hIndex: 'H-index', q12: 'Publicaciones Q1–Q2', porAnio: 'Por año', porCuartil: 'Por cuartil', porcentajeQ12: 'Porcentaje Q1–Q2', id: 'Identificador' };
    Object.keys(columnasColeccionInv).forEach(function(tipo) {
      columnasColeccionInv[tipo].concat(camposTablaColeccionInv[tipo]).forEach(function(par) { if (!etiquetas[par[0]]) etiquetas[par[0]] = par[1]; });
    });
    var texto = etiquetas[clave] || clave.replace(/([a-záéíóúñ])([A-ZÁÉÍÓÚÑ])/g, '$1 $2');
    return texto.charAt(0).toUpperCase() + texto.slice(1);
  }

  // Las rutas representan indicadores individuales o campos de las colecciones.
  function opcionesElementosDescarga(reporte) {
    var opciones = {};
    Object.keys(reporte.secciones).forEach(function(seccion) {
      var lista = [];
      function recorrer(valor, ruta, nombres) {
        if (valor && !Array.isArray(valor) && typeof valor === 'object') {
          Object.keys(valor).forEach(function(clave) {
            if (seccion === 'graficos' && clave === 'filtros') return;
            recorrer(valor[clave], ruta.concat(clave), nombres.concat(etiquetaDescarga(clave)));
          });
        } else lista.push({ ruta: ruta.join('.'), etiqueta: nombres.join(' / ') });
      }
      var datos = reporte.secciones[seccion];
      if (['publicaciones', 'proyectos', 'eventos', 'investigadores'].indexOf(seccion) !== -1 && Array.isArray(datos)) {
        var campos = [];
        datos.forEach(function(item) { Object.keys(item).forEach(function(campo) { if (campos.indexOf(campo) === -1) campos.push(campo); }); });
        if (!campos.length && columnasColeccionInv[seccion]) campos = columnasColeccionInv[seccion].map(function(par) { return par[0]; });
        campos.forEach(function(campo) { lista.push({ ruta: campo, etiqueta: etiquetaDescarga(campo) }); });
      } else if (seccion === 'estadisticas' && datos.indicadores) {
        datos.indicadores.forEach(function(item, indice) { lista.push({ ruta: 'indicadores.' + indice, etiqueta: item.indicador }); });
      } else recorrer(datos, [], []);
      if (!lista.length) lista.push({ ruta: '__vacio', etiqueta: 'Incluir estado sin registros' });
      opciones[seccion] = lista;
    });
    return opciones;
  }

  function prepararElementosDescarga(contexto) {
    var prefijo = contexto === 'carrera' ? 'carrera-' : 'inv-';
    var dialogo = document.getElementById(prefijo + 'dialogo-descarga');
    var controles = Array.from(dialogo.querySelectorAll('input[name="seccion-reporte"]'));
    var secciones = controles.map(function(control) { return control.value; });
    var reporte = contexto === 'carrera' ? datosDescargaCarrera(secciones) : datosDescargaInvestigador(secciones);
    if (!reporte) return;
    var opciones = opcionesElementosDescarga(reporte);
    var anterior = dialogo.querySelector('.descarga-elementos');
    if (anterior) anterior.remove();
    var contenedor = document.createElement('div');
    contenedor.className = 'descarga-elementos';
    contenedor.innerHTML = '<p class="reporte-nota">Despliega cada sección para elegir indicadores, gráficos o campos. Se conservan los filtros actuales.</p>' + secciones.map(function(seccion) {
      return '<details data-seccion="' + seccion + '"><summary>' + escaparReporte(etiquetaDescarga(seccion)) + '</summary><fieldset><legend class="sr-only">Elementos de ' + escaparReporte(etiquetaDescarga(seccion)) + '</legend>' + opciones[seccion].map(function(opcion) {
        return '<label><input type="checkbox" name="elemento-reporte" data-seccion="' + seccion + '" value="' + escaparReporte(opcion.ruta) + '" checked> ' + escaparReporte(opcion.etiqueta) + '</label>';
      }).join('') + '</fieldset></details>';
    }).join('');
    dialogo.querySelector('.inv-opciones-descarga').after(contenedor);
    controles.forEach(function(control) {
      function actualizar() {
        var detalle = contenedor.querySelector('[data-seccion="' + control.value + '"]');
        detalle.hidden = !control.checked;
        detalle.querySelectorAll('input').forEach(function(input) { input.disabled = !control.checked; });
      }
      control.onchange = actualizar;
      actualizar();
    });
  }

  function filtrarElementosDescarga(reporte, dialogo) {
    var seleccion = {};
    dialogo.querySelectorAll('input[name="elemento-reporte"]:checked:not(:disabled)').forEach(function(control) {
      if (!seleccion[control.dataset.seccion]) seleccion[control.dataset.seccion] = [];
      seleccion[control.dataset.seccion].push(control.value);
    });
    Object.keys(reporte.secciones).forEach(function(seccion) {
      var rutas = seleccion[seccion] || [];
      if (!rutas.length) { delete reporte.secciones[seccion]; return; }
      var datos = reporte.secciones[seccion];
      if (Array.isArray(datos)) {
        reporte.secciones[seccion] = datos.map(function(item) {
          var copia = {};
          rutas.forEach(function(campo) { if (Object.prototype.hasOwnProperty.call(item, campo)) copia[campo] = item[campo]; });
          return copia;
        });
      } else if (seccion === 'estadisticas' && datos.indicadores) {
        reporte.secciones[seccion] = { indicadores: datos.indicadores.filter(function(item, indice) { return rutas.indexOf('indicadores.' + indice) !== -1; }) };
      } else {
        function proyectar(valor, ruta) {
          if (rutas.indexOf(ruta) !== -1) return valor;
          var copia = {};
          Object.keys(valor || {}).forEach(function(clave) {
            var siguiente = ruta ? ruta + '.' + clave : clave;
            if (rutas.some(function(r) { return r === siguiente || r.indexOf(siguiente + '.') === 0; })) copia[clave] = proyectar(valor[clave], siguiente);
          });
          return copia;
        }
        reporte.secciones[seccion] = proyectar(datos, '');
        if (seccion === 'graficos' && datos.filtros) {
          reporte.secciones[seccion].filtros = {};
          Object.keys(datos.filtros).forEach(function(clave) {
            if (rutas.indexOf(clave === 'histograma' ? 'publicaciones' : clave) !== -1) reporte.secciones[seccion].filtros[clave] = datos.filtros[clave];
          });
        }
      }
    });
    return reporte;
  }

  // FIN: Selección detallada de elementos para descarga

  // INICIO: Documento visual e impresión de reportes

  function htmlDescargaInvestigador(reporte, contexto) {
    // Documento independiente: las dimensiones de pantalla no pasan al PDF.
    function texto(valor) {
      if (valor == null || valor === '') return 'No registrado';
      if (Array.isArray(valor)) return valor.length ? valor.map(texto).join('; ') : 'Sin registros';
      if (typeof valor === 'object') return Object.keys(valor).map(function(clave) { return etiquetaDescarga(clave) + ': ' + texto(valor[clave]); }).join('; ');
      return String(valor);
    }
    function tabla(filas) {
      if (!filas.length) return '<p>Sin registros.</p>';
      var campos = [];
      filas.forEach(function(fila) { Object.keys(fila).forEach(function(campo) { if (campos.indexOf(campo) === -1) campos.push(campo); }); });
      var html = '';
      // El número correlativo permite relacionar los bloques sin exportar campos no elegidos.
      for (var inicio = 0; inicio < campos.length; inicio += 4) {
        var bloque = campos.slice(inicio, inicio + 4);
        html += '<div class="exportacion-tabla"><p class="continuacion">Campos ' + (inicio + 1) + '–' + Math.min(inicio + 4, campos.length) + ' de ' + campos.length + (inicio ? ' · Continuación' : '') + '</p><table><colgroup><col style="width:7%">' + bloque.map(function() { return '<col style="width:' + 93 / bloque.length + '%">'; }).join('') + '</colgroup><thead><tr><th scope="col">N.º</th>' + bloque.map(function(campo) { return '<th scope="col">' + escaparReporte(etiquetaDescarga(campo)) + '</th>'; }).join('') + '</tr></thead><tbody>' + filas.map(function(fila, indice) {
          return '<tr><th scope="row">' + (indice + 1) + '</th>' + bloque.map(function(campo) { return '<td>' + escaparReporte(texto(fila[campo])) + '</td>'; }).join('') + '</tr>';
        }).join('') + '</tbody></table></div>';
      }
      return html;
    }
    function contenido(datos, nivel) {
      if (Array.isArray(datos)) return datos.every(function(item) { return item && typeof item === 'object' && !Array.isArray(item); }) ? tabla(datos) : '<p>' + escaparReporte(texto(datos)) + '</p>';
      if (!datos || typeof datos !== 'object') return '<p>' + escaparReporte(texto(datos)) + '</p>';
      var escalares = {}, html = '';
      Object.keys(datos).forEach(function(clave) {
        if (datos[clave] && typeof datos[clave] === 'object') html += '<h' + nivel + '>' + escaparReporte(etiquetaDescarga(clave)) + '</h' + nivel + '>' + contenido(datos[clave], Math.min(nivel + 1, 6));
        else escalares[clave] = datos[clave];
      });
      return (Object.keys(escalares).length ? tabla([escalares]) : '') + html;
    }
    var graficos = contexto === 'carrera' ? { series: 'carrera-series', publicaciones: 'carrera-histograma', proyectos: 'carrera-grafico-proyectos', eventos: 'carrera-grafico-eventos' } : { calidadHIndex: 'inv-grafico-calidad', proyectos: 'inv-grafico-proyectos' };
    var cuerpo = Object.keys(reporte.secciones).map(function(seccion) {
      var datos = reporte.secciones[seccion];
      var html = '';
      if (seccion === 'graficos') {
        Object.keys(datos).filter(function(clave) { return clave !== 'filtros'; }).forEach(function(clave) {
          var original = document.getElementById(graficos[clave]);
          if (original) {
            var copia = original.cloneNode(true);
            copia.removeAttribute('id');
            copia.querySelectorAll('svg').forEach(function(svg) { svg.removeAttribute('style'); });
            var serie = copia.querySelector('.carrera-series-svg');
            var vista = serie ? serie.getAttribute('viewBox').split(/\s+/).map(Number) : null;
            if (vista && vista[2] > 680) {
              // Conserva la escala de una serie larga continuándola debajo.
              for (var desplazamiento = 0; desplazamiento < vista[2]; desplazamiento += 640) {
                var tramo = copia.cloneNode(true);
                tramo.querySelector('svg').setAttribute('viewBox', desplazamiento + ' 0 680 ' + vista[3]);
                html += '<figure><figcaption>' + escaparReporte(etiquetaDescarga(clave)) + ' · Tramo ' + (desplazamiento / 640 + 1) + '</figcaption>' + tramo.outerHTML + '</figure>';
              }
            } else html += '<figure><figcaption>' + escaparReporte(etiquetaDescarga(clave)) + '</figcaption>' + copia.outerHTML + '</figure>';
          }
          html += '<h3>' + escaparReporte(etiquetaDescarga(clave)) + ' · Datos</h3>' + contenido(datos[clave], 4);
        });
        if (datos.filtros) html += '<h3>Filtros de los gráficos</h3>' + contenido(datos.filtros, 4);
      } else html = contenido(datos, 3);
      return '<section><h2>' + escaparReporte(etiquetaDescarga(seccion)) + '</h2>' + html + '</section>';
    }).join('');
    var estilosGraficos = document.getElementById('empiria-estilos').textContent;
    var estilos = `
      @page { size: A4 portrait; margin: 14mm; }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: auto; height: auto; min-width: 0; overflow: visible; }
      body { display: block; max-width: 182mm; margin: 0 auto; padding: 16px; background: white; color: #172f42; font: 11px/1.45 Arial, sans-serif; }
      h1 { font-size: 22px; } h2 { font-size: 18px; margin: 24px 0 12px; } h3 { font-size: 14px; } h4, h5, h6 { font-size: 12px; }
      h1, h2, h3, h4, h5, h6, figcaption { break-after: avoid; overflow-wrap: anywhere; }
      section, .exportacion-tabla { min-width: 0; max-width: 100%; break-inside: auto; }
      table { width: 100%; min-width: 0; max-width: 100%; table-layout: fixed; border-collapse: collapse; margin-bottom: 16px; }
      th, td { border: 1px solid #c8d4de; padding: 6px; text-align: left; vertical-align: top; white-space: normal; overflow-wrap: anywhere; word-break: break-word; font: inherit; }
      thead th { background: #eaf2f8; font-weight: bold; position: static; }
      thead { display: table-header-group; } tr { break-inside: avoid; }
      p { overflow-wrap: anywhere; } .continuacion { font-size: 10px; margin-bottom: 4px; }
      figure { margin: 16px 0; max-width: 100%; overflow: hidden; break-inside: avoid; }
      figcaption { font-weight: bold; margin-bottom: 8px; }
      figure > div { width: 100%; min-width: 0; overflow: visible; }
      figure svg { display: block; width: 100%; min-width: 0 !important; height: auto; max-height: 90mm; }
      figure .carrera-series-leyenda, figure .reporte-leyenda { display: flex; flex-wrap: wrap; gap: 8px 16px; min-width: 0; list-style: none; padding: 0; }
      figure .reporte-pastel-contenedor { flex-direction: column; }
      figure .carrera-barras-verticales { min-width: 0; height: auto; flex-wrap: wrap; padding: 0; }
      figure .carrera-barras-verticales li { min-width: 48px; max-width: 100%; }
      @media print { body { padding: 0; max-width: none; } * { print-color-adjust: exact; -webkit-print-color-adjust: exact; } }
    `;
    var contextoTexto = contexto === 'carrera' ? '<p>' + escaparReporte('Carrera: ' + reporte.carrera + ' · Línea: ' + reporte.linea + ' · ' + (reporte.periodo === 'todos' ? 'Todos los ciclos' : reporte.ciclo)) + '</p>' : '';
    return '<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empiria · ' + escaparReporte(reporte.titulo) + '</title><style>' + estilosGraficos + estilos + '</style></head><body><header><h1>Empiria · ' + escaparReporte(reporte.titulo) + '</h1><p>Generado: ' + escaparReporte(reporte.generado) + '</p>' + contextoTexto + '</header><main>' + cuerpo + '</main></body></html>';
  }

  // FIN: Documento visual e impresión de reportes

  // INICIO: Generación y descarga de archivos

  function descargarReporteInvestigador(event, contexto) {
    var carrera = contexto === 'carrera';
    var prefijo = carrera ? 'carrera-' : 'inv-';
    event.preventDefault();
    var secciones = [];
    document.querySelectorAll('#' + prefijo + 'dialogo-descarga input[name="seccion-reporte"]:checked').forEach(function(control) { secciones.push(control.value); });
    if (!secciones.length) { textoReporte(prefijo + 'descarga-estado', 'Selecciona al menos una sección.'); return; }
    var reporte = carrera ? datosDescargaCarrera(secciones) : datosDescargaInvestigador(secciones);
    if (!reporte) { textoReporte(prefijo + 'descarga-estado', 'Selecciona un investigador antes de generar el reporte.'); return; }
    reporte = filtrarElementosDescarga(reporte, document.getElementById(prefijo + 'dialogo-descarga'));
    if (!Object.keys(reporte.secciones).length) { textoReporte(prefijo + 'descarga-estado', 'Selecciona al menos un elemento dentro de las secciones.'); return; }
    var formato = valorReporte(prefijo + 'formato-descarga');
    var contenido = formato === 'json' ? JSON.stringify(reporte, null, 2) : formato === 'csv' ? csvDescargaInvestigador(reporte) : htmlDescargaInvestigador(reporte, contexto);
    if (formato === 'pdf') {
      var ventana = window.open('', '_blank');
      if (!ventana) { textoReporte(prefijo + 'descarga-estado', 'Permite abrir ventanas emergentes para imprimir o guardar el PDF.'); return; }
      ventana.document.open();
      ventana.document.write(contenido);
      ventana.document.close();
      ventana.focus();
      var fuentes = ventana.document.fonts ? ventana.document.fonts.ready : Promise.resolve();
      fuentes.then(function() { ventana.requestAnimationFrame(function() { ventana.print(); }); });
      textoReporte(prefijo + 'descarga-estado', 'En la ventana de impresión elige Guardar como PDF.');
      return;
    }
    var url = URL.createObjectURL(new Blob([contenido], { type: { html: 'text/html;charset=utf-8', csv: 'text/csv;charset=utf-8', json: 'application/json;charset=utf-8' }[formato] }));
    var enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = (carrera ? 'empiria-reporte-carrera' : 'reporte-investigador-' + valorReporte('select-investigador').replace(/[^a-z0-9_-]/gi, '_')) + '.' + formato;
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    textoReporte(prefijo + 'descarga-estado', 'Reporte generado con las secciones y filtros seleccionados.');
  }

  // FIN: Generación y descarga de archivos

  // INICIO: Acceso al consolidado en Google Sheets

  // FA-007: URL del consolidado ya localizado por ciclo en esta sesión.
  var CONSOLIDADOS_CICLO = {};
  // Solo para la vista local sin Apps Script; en el despliegue lo resuelve obtenerConsolidadoCiclo.
  var CONSOLIDADO_GENERAL = 'https://docs.google.com/spreadsheets/d/1JOwi7O7ZdHK16TMNMydyng7rG6aaONDSctEYa1vMjl0/edit?usp=sharing';

  function abrirGoogleSheetsReporte() {
    // FA-008 de CU-005: la apertura del consolidado es una operación protegida; si la
    // sesión expiró se bloquea, se cierra la sesión y se solicita autenticarse otra vez.
    if (typeof probarOperacionProtegida === 'function' && !probarOperacionProtegida()) return;
    var ciclo = cicloReporte();
    // La pestaña se abre de inmediato (antes de la llamada asíncrona) para que el
    // navegador no la bloquee; con 'noopener' window.open devolvería null.
    var ventana = window.open('', '_blank');
    if (!ventana) { alert('No se pudo abrir el consolidado. El navegador bloqueó las ventanas emergentes. Permita las ventanas emergentes e intente nuevamente.'); return; }
    ventana.opener = null;
    // FA-017: se registra la incidencia, se comprueba si el archivo ya existe y se
    // ofrece reintentar (regresa a FA-007) o volver a Reportes.
    function fallo() {
      ventana.close();
      registrarAuditoria('Consolidado', 'Error de permisos, cuota o conexión con Google Sheets o Drive al abrir el consolidado.', ciclo);
      avisoSistema('No se pudo abrir el consolidado por un error de permisos, cuota o conexión con Google Sheets o Drive. ' + (CONSOLIDADOS_CICLO[ciclo] ? 'El consolidado del ciclo ya existe; el reintento no creará otro.' : 'No se creó ningún archivo.'), 'Reintentar', abrirGoogleSheetsReporte);
    }
    // FA-007 paso 4: abre la URL autorizada en la otra pestaña.
    function abrir(url) {
      CONSOLIDADOS_CICLO[ciclo] = url;
      ventana.location.href = url;
    }
    if (typeof condicionConsolidadoError === 'function' && condicionConsolidadoError()) { fallo(); return; }
    // FA-007 pasos 2 y 3: el servidor localiza, crea si falta y registra el consolidado del ciclo.
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(abrir).withFailureHandler(fallo).obtenerConsolidadoCiclo(ciclo);
    } else {
      abrir(CONSOLIDADOS_CICLO[ciclo] || CONSOLIDADO_GENERAL); // vista local sin Apps Script
    }
  }

  // FIN: Acceso al consolidado en Google Sheets

  // INICIO: Modo oscuro
  // El tema inicial lo fija Index antes de pintar; aquí solo se alterna y se recuerda.
  function alternarTema() {
    var oscuro = document.documentElement.getAttribute('data-theme') !== 'dark';
    document.documentElement.setAttribute('data-theme', oscuro ? 'dark' : 'light');
    try { localStorage.setItem('empiria-tema', oscuro ? 'oscuro' : 'claro'); } catch (e) {}
    actualizarBotonTema();
    // Los gráficos leen los colores de los tokens al dibujarse.
    if (datosReportesCache) actualizarReportesPorCiclo();
  }

  function actualizarBotonTema() {
    var oscuro = document.documentElement.getAttribute('data-theme') === 'dark';
    var boton = document.getElementById('btn-tema');
    var etiqueta = oscuro ? 'Activar modo claro' : 'Activar modo oscuro';
    boton.setAttribute('aria-pressed', String(oscuro));
    boton.setAttribute('aria-label', etiqueta);
    boton.setAttribute('title', etiqueta);
    document.getElementById('icono-tema').className = 'fa-solid ' + (oscuro ? 'fa-sun' : 'fa-moon');
  }
  actualizarBotonTema();
  // FIN: Modo oscuro

  // INICIO: Cierre contextual de desplegables

  // Cierre contextual de desplegables
  window.onclick = function(event) {
    if (!event.target.closest('.relative')) {
      var dropdown = document.getElementById('ciclo-dropdown');
      if (dropdown && !dropdown.classList.contains('hidden')) {
        dropdown.classList.add('hidden');
      }
    }
  };
  // FIN: Cierre contextual de desplegables

</script>
