<script>
  
  // INICIO: 1. CONTROL DE SESIÓN SIMULADO
  function iniciarSesion(destino) {
    // FA-001 y FA-002: la sesión invalidada y la base de datos no disponible se
    // comprueban antes de continuar (bloquean el acceso y se reintentan).
    if (typeof probarInicioSesion === 'function' && !probarInicioSesion()) return;
    var viewLogin = document.getElementById('view-login');
    var dashboard = document.getElementById('app-dashboard');

    if (viewLogin && dashboard) {
      Alpine.store('navegacion').sesionIniciada = true;
      dashboard.classList.add('fade-in');

      // FA-020: antes de continuar, las transacciones colgadas por un cierre
      // inesperado se marcan como Fallido y quedan registradas en auditoría.
      rescatarTransaccionesColgadas();

      renderizarPlantillas();
      actualizarSelectPlantillas();

      // FA-003 de CU-002 (paso 4): sin ciclo activo se informa y se redirige a Ciclos.
      if (typeof estaConPrueba === 'function' && estaConPrueba('sinCicloActivo')) {
        switchTab('ciclo');
        avisoSistema('No existe un ciclo académico activo. Active un ciclo antes de continuar.', 'Aceptar');
        return;
      }
      // Paso 6: panel principal con el ciclo activo; FA-019 regresa directamente a Tareas.
      switchTab(destino === 'tareas' ? 'tareas' : 'inicio');
    }
  }

  function cerrarSesion() {
    cerrarModalExito();
    cerrarModalCrearPlantilla();
    cancelarFormulario();
    Alpine.store('navegacion').sesionIniciada = false;
    cicloEstadoActual = 'ACTIVO';
    selectCiclo('Ciclo 2026-II', 'ACTIVO');
    switchTab('inicio');
  }

  // FIN: 1. CONTROL DE SESIÓN SIMULADO

  // INICIO: 2. ESTADO GLOBAL
  var MAPEO_CLASES = {
    'Ciclo 2026-II': 'Investigadores 2026-II',
    'Ciclo 2026-I': 'Investigadores 2026-I',
    'Ciclo 2025-II': 'Investigadores 2025-II'
  };

  var cicloEstadoActual = 'ACTIVO';
  var filtroPlantillasActual = 'todas';
  // Espera simulada de la publicación en curso (pasos 35 a 38 y reintentos de FA-016).
  var temporizadorTarea = null;

  var plantillas = [
    {
      id: 'P1',
      nombre: 'Plantilla_Base_Proyectos_v1',
      extension: '.gsheet',
      fechaSubida: '15/03/2026',
      numHojas: 5,
      hojas: ['Hoja1', 'Hoja2', 'Hoja3', 'Hoja4', 'Hoja5'],
      estado: 'disponible',
      cicloAsociado: null,
      urlSheets: 'https://docs.google.com/spreadsheets/d/1abcDEMO123/edit'
    },
    {
      id: 'P2',
      nombre: 'Plantilla_Informe_Financiero_v2',
      extension: '.gsheet',
      fechaSubida: '10/03/2026',
      numHojas: 3,
      hojas: ['Hoja1', 'Hoja2', 'Hoja3'],
      estado: 'en_uso',
      cicloAsociado: 'Ciclo 2026-I',
      urlSheets: 'https://docs.google.com/spreadsheets/d/2defDEMO456/edit'
    }
  ];

  // FIN: 2. ESTADO GLOBAL

  // INICIO: 3. CONTROL FORMULARIO TAREA
  function toggleFormTarea(show) {
    if (show && cicloEstadoActual === 'CERRADO') {
      alert('No se puede asignar tareas en un ciclo cerrado. Seleccione el ciclo activo.');
      return;
    }
    // FA-003 y FA-005 a FA-009: condiciones de prueba y precondiciones de clase,
    // plantilla, Drive y estudiantes (pasos 10 a 16).
    if (show && typeof validarCondicionesTarea === 'function' && !validarCondicionesTarea()) return;

    var form = document.getElementById('form-asignar-tarea');
    var placeholder = document.getElementById('placeholder-tareas');
    
    if (show) {
      actualizarSelectPlantillas();
      form.classList.remove('hidden');
      placeholder.classList.add('hidden');
    } else {
      form.classList.add('hidden');
      placeholder.classList.remove('hidden');
    }
  }

  function cancelarFormulario() {
    clearTimeout(temporizadorTarea);
    // FA-013/RN-002-08: si había una publicación en proceso, su transacción queda Cancelada.
    if (typeof marcarCancelacionFormulario === 'function') marcarCancelacionFormulario();
    document.getElementById('form-tarea-element').reset();
    limpiarErrores();
    resetearBotonCrear();
    toggleFormTarea(false);
  }

  function setBotonCreando(creando) {
    var btn = document.getElementById('btn-crear-tarea');
    var icon = document.getElementById('icon-crear-tarea');
    var texto = document.getElementById('texto-crear-tarea');

    if (creando) {
      btn.disabled = true;
      btn.classList.add('opacity-70', 'cursor-not-allowed');
      icon.className = 'fa-solid fa-spinner spinner';
      texto.innerText = 'Creando…';
    } else {
      btn.disabled = false;
      btn.classList.remove('opacity-70', 'cursor-not-allowed');
      icon.className = 'fa-solid fa-paper-plane';
      texto.innerText = 'Crear tarea';
    }
    // FA-013 aplica antes del envío (pasos 18 a 24): Cancelar y X se bloquean durante la
    // publicación, cuando solo procede FA-014 con «Cancelar publicación».
    ['btn-cancelar-formulario', 'btn-cerrar-formulario'].forEach(function(id) { document.getElementById(id).disabled = creando; });
    // FA-014: el botón Cancelar publicación solo existe mientras hay una publicación en curso.
    if (typeof actualizarControlCancelarPublicacion === 'function') actualizarControlCancelarPublicacion(creando);
  }

  function resetearBotonCrear() { setBotonCreando(false); }

  function limpiarErrores() {
    document.querySelectorAll('.input-error').forEach(function(el) { el.classList.remove('input-error'); });
  }

  function marcarError(elementId) {
    var el = document.getElementById(elementId);
    if (el) {
      el.classList.add('input-error');
      el.focus();
    }
  }

  function esFechaFutura(fechaStr, horaStr) {
    if (!fechaStr) return false;
    var ahora = new Date();
    var fechaHora = new Date(fechaStr + 'T' + (horaStr || '00:00'));
    return fechaHora > ahora;
  }

  function actualizarAyudaRangoHojas() {
    var plantillaId = document.getElementById('input-plantilla').value;
    var plantilla = plantillas.find(function(p) { return p.id === plantillaId; });
    document.getElementById('ayuda-rango-hojas').textContent = plantilla && plantilla.hojas
      ? 'Hojas disponibles, en orden: ' + plantilla.hojas.join(' → ') + '. Puede seleccionar una sola hoja usando el mismo nombre en ambos extremos.'
      : 'Seleccione una plantilla para consultar sus hojas disponibles.';
  }

  function validarRangoHojas(plantillaId) {
    var plantilla = plantillas.find(function(p) { return p.id === plantillaId; });
    var hojas = plantilla && Array.isArray(plantilla.hojas) ? plantilla.hojas : [];
    var inicio = document.getElementById('input-hoja-inicial').value.trim();
    var fin = document.getElementById('input-hoja-final').value.trim();
    var indiceInicio = hojas.indexOf(inicio);
    var indiceFin = hojas.indexOf(fin);
    if (indiceInicio === -1 || indiceFin === -1 || indiceInicio > indiceFin) {
      marcarError(indiceInicio === -1 || indiceInicio > indiceFin ? 'input-hoja-inicial' : 'input-hoja-final');
      alert('El rango de hojas no es válido para la plantilla seleccionada.');
      return false;
    }
    return true;
  }

  function crearTarea(e) {
    e.preventDefault();
    limpiarErrores();

    var titulo = document.getElementById('input-titulo').value.trim();
    var descripcion = document.getElementById('input-descripcion').value.trim();
    var fecha = document.getElementById('input-fecha').value;
    var hora = document.getElementById('input-hora').value;
    var plantillaId = document.getElementById('input-plantilla').value;

    if (!titulo) { marcarError('input-titulo'); alert('El título de la actividad es obligatorio.'); return; }
    if (!descripcion) { marcarError('input-descripcion'); alert('La descripción de la actividad es obligatoria.'); return; }
    if (!esFechaFutura(fecha, hora)) { marcarError('input-fecha'); alert('La fecha y hora de entrega deben ser posteriores a la fecha y hora actuales.'); return; }
    // FA-010, paso 28: la entrega no puede exceder la fecha de fin del ciclo seleccionado.
    if (excedeFinCicloEntrega(fecha, hora)) { marcarError('input-fecha'); alert('La fecha y hora de entrega no pueden exceder la fecha de fin del ciclo seleccionado.'); return; }
    if (!plantillaId) { marcarError('input-plantilla'); alert('Debe seleccionar una plantilla base.'); return; }
    if (!validarRangoHojas(plantillaId)) return;

    var ciclo = document.getElementById('input-ciclo-context').value;

    // FA-011 (paso 31): control de título duplicado en la clase del ciclo seleccionado.
    if (existeTareaMismoNombre(ciclo, titulo)) {
      marcarError('input-titulo');
      alert('Ya existe una tarea con el mismo nombre en esta clase. Modifique el título de la actividad antes de continuar.');
      return;
    }

    iniciarPublicacion({ titulo: titulo, descripcion: descripcion, fecha: fecha, hora: hora, plantillaId: plantillaId, ciclo: ciclo });
  }

  // Pasos 32 a 34; FA-018 («Reintentar») regresa a este punto.
  function iniciarPublicacion(datos) {
    // FA-012 (paso 32): no puede existir otra publicación en curso para el mismo ciclo.
    if (hayPublicacionEnCurso(datos.ciclo)) {
      alert('Ya existe una publicación en curso. Espere a que finalice antes de iniciar una nueva.');
      return;
    }
    setBotonCreando(true); // paso 33
    var transaccion = iniciarTransaccion(datos.ciclo, datos.titulo, datos.plantillaId); // paso 34
    // Pasos 35 a 42, con FA-014 a FA-019 ante cancelación o fallo.
    temporizadorTarea = setTimeout(function() { procesarPublicacion(transaccion, datos); }, 1200);
  }

  function cerrarModalExito() { document.getElementById('modal-exito').classList.add('hidden'); }

  // Pasos 44 y 45: «Aceptar» cierra el modal, limpia y oculta el formulario.
  function aceptarModalExito() {
    cerrarModalExito();
    cancelarFormulario();
  }

  // FIN: 3. CONTROL FORMULARIO TAREA

  // INICIO: 4. NAVEGACIÓN POR PESTAÑAS
  function toggleSidebar() {
    var sidebar = document.getElementById('sidebar-trabajo');
    var reducido = sidebar.classList.toggle('sidebar-reducido');
    var boton = document.getElementById('btn-toggle-sidebar');
    var etiqueta = (reducido ? 'Expandir' : 'Contraer') + ' Espacio de Trabajo';
    boton.setAttribute('aria-expanded', String(!reducido));
    boton.setAttribute('aria-label', etiqueta);
    boton.setAttribute('title', etiqueta);
    document.getElementById('icono-toggle-sidebar').className = 'fa-solid ' + (reducido ? 'fa-angles-right' : 'fa-angles-left');
  }

  var MODULOS = {
    inicio: { subtitulo: 'Vista general y accesos a tu espacio de trabajo.', titulo: 'Panel Principal' },
    ciclo: { subtitulo: 'Organización de los periodos de investigación.', titulo: 'Módulo de Ciclos' },
    clases: { subtitulo: 'Clases de investigación y vinculación con Google Classroom.', titulo: 'Módulo de Clases' },
    plantillas: { subtitulo: 'Documentos base para tus actividades de seguimiento.', titulo: 'Módulo de Plantillas Base', alEntrar: renderizarPlantillas },
    tareas: { subtitulo: 'Gestión e integración con Google Classroom.', titulo: 'Módulo de Tareas', alEntrar: actualizarUICiclo },
    reportes: { subtitulo: 'Indicadores y producción científica de los investigadores.', titulo: 'Módulo de Reportes de Investigación', alEntrar: inicializarModuloReportes }
  };

  // Puente para los flujos existentes; Alpine es el único dueño de la vista activa.
  function switchTab(tabId) {
    Alpine.store('navegacion').navegar(tabId);
  }

  // FIN: 4. NAVEGACIÓN POR PESTAÑAS

  // INICIO: 5. GESTIÓN DEL CICLO ACTIVO / CERRADO
  function toggleCicloDropdown() {
    document.getElementById('ciclo-dropdown').classList.toggle('hidden');
  }

  function selectCiclo(nombreCiclo, estado) {
    document.getElementById('selected-ciclo-label').innerText = nombreCiclo;
    document.querySelectorAll('#ciclo-dropdown [data-ciclo]').forEach(function(boton) {
      boton.setAttribute('aria-pressed', String(boton.dataset.ciclo === nombreCiclo));
    });
    document.getElementById('input-ciclo-context').value = nombreCiclo;
    document.getElementById('input-clase-context').value = MAPEO_CLASES[nombreCiclo] || 'Sin clase asignada';

    cicloEstadoActual = estado;

    document.getElementById('ciclo-dropdown').classList.add('hidden');
    actualizarUICiclo();

    if (estado === 'CERRADO' && !document.getElementById('form-asignar-tarea').classList.contains('hidden')) {
      cancelarFormulario();
    }
    actualizarReportesPorCiclo();
  }

  function actualizarUICiclo() {
    var btnAsignar = document.getElementById('btn-asignar-tarea');
    var aviso = document.getElementById('aviso-ciclo-cerrado');

    if (cicloEstadoActual === 'CERRADO') {
      btnAsignar.classList.add('btn-disabled');
      btnAsignar.setAttribute('disabled', 'disabled');
      aviso.classList.remove('hidden');
    } else {
      btnAsignar.classList.remove('btn-disabled');
      btnAsignar.removeAttribute('disabled');
      aviso.classList.add('hidden');
    }
  }

  // FIN: 5. GESTIÓN DEL CICLO ACTIVO / CERRADO

  // INICIO: 6. MÓDULO DE PLANTILLAS
  function renderizarPlantillas() {
    var contenedor = document.getElementById('lista-plantillas');
    var vacio = document.getElementById('plantillas-vacio');
    if (!contenedor) return;

    var filtradas = plantillas;
    if (filtroPlantillasActual === 'disponible') {
      filtradas = plantillas.filter(function(p) { return p.estado === 'disponible'; });
    } else if (filtroPlantillasActual === 'en_uso') {
      filtradas = plantillas.filter(function(p) { return p.estado === 'en_uso'; });
    }

    if (filtradas.length === 0) {
      contenedor.innerHTML = '';
      vacio.classList.remove('hidden');
      return;
    }

    vacio.classList.add('hidden');
    contenedor.innerHTML = filtradas.map(function(p) {
      var badgeEstado = p.estado === 'disponible'
        ? '<span class="bg-emerald-500/20 border border-emerald-400/40 text-emerald-700 text-[10px] font-bold px-2 py-0.5 rounded-full">DISPONIBLE</span>'
        : '<span class="bg-sky-500/20 border border-sky-400/40 text-blue-700 text-[10px] font-bold px-2 py-0.5 rounded-full">EN USO</span>';

      var cicloInfo = p.cicloAsociado
        ? '<span class="text-xs text-slate-500">Usada en <span class="text-blue-700 font-semibold">' + p.cicloAsociado + '</span></span>'
        : '<span class="text-xs text-slate-500">Aún no asignada</span>';

      return '<div class="plantilla-card glass-card rounded-2xl p-5 border border-slate-200 fade-in">' +
        '<div class="flex items-start justify-between mb-3">' +
          '<div class="flex items-start space-x-3">' +
            '<div class="w-11 h-11 bg-emerald-500/20 border border-emerald-400/40 text-emerald-700 rounded-xl flex items-center justify-center text-lg shrink-0">' +
              '<i class="fa-solid fa-file-excel"></i>' +
            '</div>' +
            '<div class="min-w-0">' +
              '<h3 class="text-sm font-bold text-slate-900 truncate">' + p.nombre + p.extension + '</h3>' +
              '<p class="text-xs text-slate-500 mt-0.5">Subida: ' + p.fechaSubida + ' · ' + p.numHojas + ' hojas</p>' +
            '</div>' +
          '</div>' +
          '<div class="shrink-0 ml-2">' + badgeEstado + '</div>' +
        '</div>' +
        '<div class="mb-3">' + cicloInfo + '</div>' +
        '<div class="flex items-center gap-2 pt-2 border-t border-slate-200">' +
          '<a href="' + p.urlSheets + '" target="_blank" rel="noopener noreferrer" class="flex-1 bg-slate-50 hover:bg-slate-200 text-slate-800 text-xs font-semibold py-2 rounded-lg border border-slate-200 transition-all flex items-center justify-center space-x-1.5">' +
            '<i class="fa-solid fa-arrow-up-right-from-square"></i><span>Abrir en Sheets</span>' +
          '</a>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function filtrarPlantillas(filtro) {
    filtroPlantillasActual = filtro;
    document.querySelectorAll('[data-filtro]').forEach(function(btn) { btn.classList.remove('active'); });
    var activeBtn = document.querySelector('[data-filtro="' + filtro + '"]');
    if (activeBtn) activeBtn.classList.add('active');
    renderizarPlantillas();
  }

  function actualizarSelectPlantillas() {
    var select = document.getElementById('input-plantilla');
    if (!select) return;

    var valorPrevio = select.value;
    var disponibles = plantillas.filter(function(p) { return p.estado === 'disponible'; });

    select.innerHTML = '<option value="">PLANTILLA: Seleccionar una disponible ↓</option>' +
      disponibles.map(function(p) { return '<option value="' + p.id + '">' + p.nombre + p.extension + '</option>'; }).join('');

    if (valorPrevio && disponibles.find(function(p) { return p.id === valorPrevio; })) {
      select.value = valorPrevio;
    }
    actualizarAyudaRangoHojas();
  }

  function abrirModalCrearPlantilla() {
    document.getElementById('modal-crear-plantilla').classList.remove('hidden');
    document.getElementById('form-crear-plantilla').reset();
    document.getElementById('input-nombre-plantilla').focus();
  }

  function cerrarModalCrearPlantilla() {
    // El módulo Plantillas (CU-003) aún no tiene maquetado; cerrarSesion no debe fallar.
    if (!document.getElementById('modal-crear-plantilla')) return;
    document.getElementById('modal-crear-plantilla').classList.add('hidden');
    document.getElementById('form-crear-plantilla').reset();
    limpiarErrores();
  }

  function crearPlantilla(e) {
    e.preventDefault();
    limpiarErrores();

    var nombre = document.getElementById('input-nombre-plantilla').value.trim();
    var descripcion = document.getElementById('input-descripcion-plantilla').value.trim();

    if (!nombre) { marcarError('input-nombre-plantilla'); alert('El nombre es obligatorio.'); return; }

    var yaExiste = plantillas.some(function(p) { return p.nombre.toLowerCase() === nombre.toLowerCase(); });
    if (yaExiste) { marcarError('input-nombre-plantilla'); alert('Ya existe una plantilla con ese nombre.'); return; }

    window.open('https://sheets.new', '_blank');

    plantillas.push({
      id: 'P' + (plantillas.length + 1),
      nombre: nombre,
      extension: '.gsheet',
      descripcion: descripcion,
      fechaSubida: new Date().toLocaleDateString('es-PE'),
      numHojas: 1,
      hojas: ['Hoja1'],
      estado: 'disponible',
      cicloAsociado: null,
      urlSheets: 'https://docs.google.com/spreadsheets/d/NUEVA' + Date.now() + '/edit'
    });

    cerrarModalCrearPlantilla();
    renderizarPlantillas();
    actualizarSelectPlantillas();
  }

  // FIN: 6. MÓDULO DE PLANTILLAS

  // INICIO: 7. REPORTES POR INVESTIGADOR / CARRERA Y LÍNEA DE INVESTIGACIÓN
  var datosReportesCache = null;
  var reportesCargando = false;

  function cambiarSubmoduloReportes(nombre) {
    Alpine.store('navegacion').cambiarReporte(nombre);
  }

  function navegarTabsReportes(event) {
    if (['ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(event.key) === -1) return;
    event.preventDefault();
    var destino = event.key === 'Home' ? 'investigador' : event.key === 'End' ? 'carrera' :
      Alpine.store('navegacion').reporteActual === 'investigador' ? 'carrera' : 'investigador';
    cambiarSubmoduloReportes(destino);
    document.getElementById('tab-reporte-' + destino).focus();
  }

  function inicializarModuloReportes() {
    // FA-012 y FA-013 de CU-005: repositorio alterado (paso 3). Se ocultan los
    // reportes cargados y se simula la carga cuyo reintento vuelve a fallar.
    var condicion = typeof condicionRepositorioReportes === 'function' ? condicionRepositorioReportes() : '';
    if (condicion) {
      if (reportesCargando) return;
      reportesCargando = true;
      datosReportesCache = null;
      establecerPanelesReportes(false);
      document.getElementById('estado-reportes').classList.remove('hidden');
      textoReporte('estado-reportes', 'Cargando datos de investigación…');
      document.getElementById('reintentar-reportes').classList.add('hidden');
      document.querySelectorAll('#view-reportes select').forEach(function(el) { el.disabled = true; });
      setTimeout(function() {
        reportesCargando = false;
        // Si la condición se retiró durante la "carga", el módulo recupera su ruta normal.
        if (typeof condicionRepositorioReportes !== 'function' || !condicionRepositorioReportes()) {
          inicializarModuloReportes();
          return;
        }
        document.getElementById('estado-reportes').classList.remove('hidden');
        document.getElementById('estado-reportes').classList.add('reporte-alerta');
        textoReporte('estado-reportes', condicion === 'estructura'
          ? 'No se pudieron cargar los reportes. La estructura de los datos del repositorio es inválida. Verifique el origen de los datos e intente nuevamente.'
          : 'El repositorio de datos de investigación no está disponible en este momento. Verifique la conexión e intente nuevamente.');
        document.getElementById('reintentar-reportes').classList.remove('hidden');
      }, 900);
      return;
    }
    if (reportesCargando || datosReportesCache) return;
    reportesCargando = true;
    // FA-013: no se presentan cifras hasta completar una carga válida.
    establecerPanelesReportes(false);
    document.getElementById('estado-reportes').classList.remove('hidden');
    textoReporte('estado-reportes', 'Cargando datos de investigación…');
    document.getElementById('reintentar-reportes').classList.add('hidden');
    document.querySelectorAll('#view-reportes select').forEach(function(el) { el.disabled = true; });
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run.withSuccessHandler(renderizarVistaReportes)
        .withFailureHandler(function(error) {
          // FA-012: el servidor marca con ESTRUCTURA los datos inválidos; el resto es FA-013.
          var estructura = /ESTRUCTURA/.test(String(error && error.message || error));
          mostrarErrorReportes(true, estructura ? 'No se pudieron cargar los reportes. La estructura de los datos del repositorio es inválida. Verifique el origen de los datos e intente nuevamente.' : '');
        }).obtenerDatosReportes();
    } else {
      renderizarVistaReportes({ investigadores: [] });
      document.getElementById('estado-reportes').classList.remove('hidden');
      textoReporte('estado-reportes', 'Vista local: la carga de datos requiere ejecutar la aplicación en Google Apps Script.');
    }
  }

  // Visibilidad de los paneles de reportes: se ocultan cuando no hay datos
  // cargados (estado de error) y se restauran al finalizar una carga válida.
  function establecerPanelesReportes(visibles) {
    Alpine.store('navegacion').reportesVisibles = visibles;
  }

  function mostrarErrorReportes(desdeServicio, texto) {
    reportesCargando = false;
    establecerPanelesReportes(false);
    document.getElementById('estado-reportes').classList.remove('hidden');
    document.getElementById('estado-reportes').classList.add('reporte-alerta');
    // FA-013: fallo del servicio se informa como repositorio no disponible (Reintentar).
    textoReporte('estado-reportes', texto || (desdeServicio ? 'El repositorio no está disponible. Intente nuevamente.' : 'No se pudieron cargar los reportes. Intenta nuevamente.'));

  function escaparReporte(valor) {
    return String(valor == null ? '' : valor).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function textoReporte(id, valor) {
    var el = document.getElementById(id);
    if (el) el.innerText = valor == null || valor === '' ? '—' : valor;

  function valorReporte(id) {

  function unicosReporte(valores) {
    return valores.filter(function(v, i, lista) { return v && lista.indexOf(v) === i; }).sort(function(a, b) { return a.localeCompare(b, 'es'); });

  function llenarSelectReporte(id, opciones, etiquetaTodos) {

    if (!lista.length) lista.push({ valor: '', texto: 'Sin opciones disponibles' });
    else if (etiquetaTodos) lista.unshift({ valor: '', texto: etiquetaTodos });
    select.innerHTML = lista.map(function(item) {
      return '<option value="' + escaparReporte(item.valor) + '">' + escaparReporte(item.texto) + '</option>';
    }).join('');
    select.value = lista.some(function(item) { return item.valor === anterior; }) ? anterior : lista[0].valor;
    select.disabled = opciones.length === 0;

  function registrosReporte(investigadores, campo, linea, ciclo) {
    var registros = [];

        var clave = item.id || inv.id + '-' + indice;
        if (porId[clave]) {
          if (porId[clave].autores.indexOf(inv.nombre) === -1) porId[clave].autores.push(inv.nombre);

        }
        var registro = Object.assign({}, item, { autores: [inv.nombre] });

  var datosGraficosCarrera = { publicaciones: [], proyectos: [], eventos: [] };
  var filtrosGraficosCarrera = {
    series: { temporalidad: 'ciclo', ciclo: '', indicadores: ['publicaciones', 'proyectos', 'internos', 'externos', 'eventos'] },
    histograma: { temporalidad: 'ciclo', ciclo: '', agrupacion: 'ranking' },

  // Fechas de calendario en UTC: evita desplazar días por la zona horaria del navegador.
  // FIN: Filtros por carrera, línea e investigador

  // INICIO: Fechas, agrupaciones y filtros de gráficos por carrera

  function fechaGraficoCarrera(valor) {
    var texto = String(valor || '');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(texto)) return null;
    var fecha = new Date(texto + 'T00:00:00Z');
    return isNaN(fecha.getTime()) || fecha.toISOString().slice(0, 10) !== texto ? null : fecha;
  }

  function inicioPeriodoGraficoCarrera(fecha, temporalidad) {
    var inicio = new Date(fecha.getTime());
    if (temporalidad === 'mes') inicio.setUTCDate(1);
    if (temporalidad === 'semana') inicio.setUTCDate(inicio.getUTCDate() - (inicio.getUTCDay() + 6) % 7);
    return inicio;
  }

  function semanaGraficoCarrera(fecha) {
    var jueves = inicioPeriodoGraficoCarrera(fecha, 'semana');
    jueves.setUTCDate(jueves.getUTCDate() + 3);
    var anio = jueves.getUTCFullYear();
    var numero = Math.ceil(((jueves - new Date(Date.UTC(anio, 0, 1))) / 86400000 + 1) / 7);
    return anio + '-W' + ('0' + numero).slice(-2);
  }

  function limitesPeriodoGraficoCarrera(valor, temporalidad) {
    var inicio;
    if (temporalidad === 'mes' && /^\d{4}-\d{2}$/.test(valor)) inicio = fechaGraficoCarrera(valor + '-01');
    if (temporalidad === 'dia') inicio = fechaGraficoCarrera(valor);
    if (temporalidad === 'semana' && /^\d{4}-W\d{2}$/.test(valor)) {
      inicio = inicioPeriodoGraficoCarrera(new Date(Date.UTC(Number(valor.slice(0, 4)), 0, 4)), 'semana');
      inicio.setUTCDate(inicio.getUTCDate() + (Number(valor.slice(-2)) - 1) * 7);
      if (semanaGraficoCarrera(inicio) !== valor) return null;
    }
    if (!inicio) return null;
    var fin = new Date(inicio.getTime());
    if (temporalidad === 'mes') fin = new Date(Date.UTC(inicio.getUTCFullYear(), inicio.getUTCMonth() + 1, 0));
    if (temporalidad === 'semana') fin.setUTCDate(fin.getUTCDate() + 6);
    return { desde: inicio.toISOString().slice(0, 10), hasta: fin.toISOString().slice(0, 10) };
  }

  function etiquetaPeriodoGraficoCarrera(fecha, temporalidad) {
    if (temporalidad === 'semana') return 'Semana ' + semanaGraficoCarrera(fecha).replace('-W', ' · ');
    return fecha.toLocaleDateString('es-PE', temporalidad === 'mes' ? { month: 'short', year: 'numeric', timeZone: 'UTC' } : { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
  }

  function fechaRegistroGraficoCarrera(item, tipo) {
    return fechaGraficoCarrera(tipo === 'proyectos' ? item.fechaInicio || item.fecha : item.fecha);
  }

  function datosGraficoCarrera(nombre) {
    var filtro = filtrosGraficosCarrera[nombre];
    var temporalidad = filtro.temporalidad || 'ciclo';
    var desde = temporalidad !== 'ciclo' && filtro.periodoDesde ? limitesPeriodoGraficoCarrera(filtro.periodoDesde, temporalidad) : null;
    var hasta = temporalidad !== 'ciclo' && filtro.periodoHasta ? limitesPeriodoGraficoCarrera(filtro.periodoHasta, temporalidad) : null;
    var datos = {};
    ['publicaciones', 'proyectos', 'eventos'].forEach(function(tipo) {
      datos[tipo] = datosGraficosCarrera[tipo].filter(function(item) {
        if (filtro.ciclo && item.ciclo !== filtro.ciclo) return false;
        if (filtro.cicloDesde && (!item.ciclo || item.ciclo.localeCompare(filtro.cicloDesde, 'es', { numeric: true }) < 0)) return false;
        if (filtro.cicloHasta && (!item.ciclo || item.ciclo.localeCompare(filtro.cicloHasta, 'es', { numeric: true }) > 0)) return false;
        if (temporalidad !== 'ciclo') {
          var fecha = fechaRegistroGraficoCarrera(item, tipo);
          if (!fecha || (filtro.periodoDesde && !desde) || (filtro.periodoHasta && !hasta)) return false;
          var texto = fecha.toISOString().slice(0, 10);
          if (desde && texto < desde.desde) return false;
          if (hasta && texto > hasta.hasta) return false;
        }
        return true;
      });
    });
    return datos;
  }

  function gruposGraficoCarrera(nombre, tipo) {
    var filtro = filtrosGraficosCarrera[nombre];
    var campo = filtro.agrupacion;
    if (campo === 'periodo') {
      var datos = { publicaciones: [], proyectos: [], eventos: [] };
      datos[tipo] = datosGraficoCarrera(nombre)[tipo];
      return seriesCarreraReporte(datos, filtro.temporalidad).map(function(fila) { return { nombre: fila.ciclo, valor: fila[tipo] }; });
    }
    return agruparReporte(datosGraficoCarrera(nombre)[tipo].map(function(item) {
      var grupo = campo === 'ranking' ? datoColeccionInv(item, 'calidad') : item[campo];
      return { grupo: grupo };
    }), 'grupo');
  }

  function sincronizarFiltrosGraficosCarrera() {
    var ciclos = [];
    ['publicaciones', 'proyectos', 'eventos'].forEach(function(tipo) { ciclos = ciclos.concat(datosGraficosCarrera[tipo].map(function(item) { return item.ciclo; })); });
    Object.keys(filtrosGraficosCarrera).forEach(function(nombre) {
      ['ciclo', 'cicloDesde', 'cicloHasta'].forEach(function(clave) {
        if (filtrosGraficosCarrera[nombre][clave] && ciclos.indexOf(filtrosGraficosCarrera[nombre][clave]) === -1) filtrosGraficosCarrera[nombre][clave] = '';
      });
    });
  }

    var html = '<label class="reporte-campo"><span>Temporalidad</span><select onchange="cambiarFiltroGraficoCarrera(\'temporalidad\',this.value)">' + [['ciclo', 'Por ciclo académico'], ['mes', 'Por mes'], ['semana', 'Por semana (lunes a domingo)'], ['dia', 'Por día']].map(function(par) { return '<option value="' + par[0] + '"' + (temporalidad === par[0] ? ' selected' : '') + '>' + par[1] + '</option>'; }).join('') + '</select></label>';
    html += '<fieldset class="carrera-rango-temporal"><legend>Rango de ciclos</legend>' + [['cicloDesde', 'Ciclo inicial'], ['cicloHasta', 'Ciclo final']].map(function(par) {

      html += '<label class="reporte-campo"><span>Agrupar por</span><select onchange="cambiarFiltroGraficoCarrera(\'agrupacion\',this.value)">' + opciones.map(function(par) { return '<option value="' + par[0] + '"' + (filtro.agrupacion === par[0] ? ' selected' : '') + '>' + par[1] + '</option>'; }).join('') + '</select></label>';

  function cambiarFiltroGraficoCarrera(clave, valor) {
    var filtro = filtrosGraficosCarrera[graficoCarreraActual];
    if (clave === 'temporalidad' && ['ciclo', 'mes', 'semana', 'dia'].indexOf(valor) === -1) return;
    if ((clave === 'periodoDesde' || clave === 'periodoHasta') && valor && !limitesPeriodoGraficoCarrera(valor, filtro.temporalidad)) return;
    filtro[clave] = valor;
    var renovarControles = clave === 'temporalidad';
    if (clave === 'temporalidad') { filtro.periodoDesde = ''; filtro.periodoHasta = ''; }
    if (clave === 'cicloDesde' || clave === 'cicloHasta') filtro.ciclo = '';
    // Al invertir un intervalo, se libera el extremo anterior para completarlo de nuevo.
    if (filtro.cicloDesde && filtro.cicloHasta && filtro.cicloDesde.localeCompare(filtro.cicloHasta, 'es', { numeric: true }) > 0) { filtro[clave === 'cicloDesde' ? 'cicloHasta' : 'cicloDesde'] = ''; renovarControles = true; }
    if (filtro.periodoDesde && filtro.periodoHasta && filtro.periodoDesde > filtro.periodoHasta) { filtro[clave === 'periodoDesde' ? 'periodoHasta' : 'periodoDesde'] = ''; renovarControles = true; }
    renderizarGraficosCarrera();
    if (renovarControles && document.getElementById('carrera-dialogo-grafico').open) renderizarFiltroGraficoCarrera();
  }

  function restablecerFiltroGraficoCarrera() {

    filtro.ciclo = ''; filtro.cicloDesde = ''; filtro.cicloHasta = ''; filtro.temporalidad = 'ciclo'; filtro.periodoDesde = ''; filtro.periodoHasta = '';
    if (graficoCarreraActual === 'series') filtro.indicadores = ['publicaciones', 'proyectos', 'internos', 'externos', 'eventos'];
    else filtro.agrupacion = { histograma: 'ranking', proyectos: 'tipo', eventos: 'estado' }[graficoCarreraActual];
    renderizarGraficosCarrera();
    renderizarFiltroGraficoCarrera();
  }

  function cambiarIndicadorGraficoCarrera(control) {

    return '<div class="investigador-detalle-grid"><section class="glass-card investigador-disponibilidad"><h3>Dedicación</h3><div class="reporte-dias" aria-label="Disponibilidad semanal">' + (dias.length ? disponibilidad : '<p>Sin días registrados</p>') + '</div><dl class="investigador-datos-laterales"><div><dt>Dedicación actual</dt><dd>' + valorDetalleColeccionInv(inv.dedicacion) + '</dd></div><div><dt>Categoría</dt><dd>' + valorDetalleColeccionInv(inv.categoria) + '</dd></div></dl></section>' +
      '<section class="glass-card investigador-identidad"><h3>Ficha del Investigador</h3><p class="investigador-nombre">' + escaparReporte(inv.nombre) + '</p><div class="investigador-nivel empiria-nivel" data-nivel="' + (nivel || 'sin-clasificacion') + '">RENACYT — ' + escaparReporte(inv.renacytNivel || 'Sin clasificación') + '</div><dl class="inv-detalles-grid">' + campos.map(function(par) { return '<div><dt>' + par[0] + '</dt><dd>' + valorDetalleColeccionInv(par[1]) + '</dd></div>'; }).join('') + '</dl><div class="inv-perfil-lineas"><span class="reporte-etiqueta">Líneas de investigación</span><div class="investigador-lineas empiria-lineas">' + lineas + '</div></div>' + (url ? '<a class="investigador-enlace-cti" href="' + escaparReporte(url) + '" target="_blank" rel="noopener noreferrer">' + (urlReporte(inv.ctivitaeUrl) ? 'Ver perfil CTI Vitae ↗' : 'Consultar CTI Vitae ↗') + '</a>' : '') + '</section></div>';

  function abrirInvestigadorCarrera(indice) {
    var inv = investigadoresCarreraReporte(true)[indice];
    if (!inv) return;
    dialogoColeccionInv = null;

  // FA-018 de CU-005: un ciclo cerrado se consulta como histórico de solo lectura.
  function actualizarAvisoReportesCerrado() {
    document.getElementById('aviso-reportes-cerrado').classList.toggle('hidden', cicloEstadoActual !== 'CERRADO');
  }

  function actualizarReportesPorCiclo() {
    actualizarAvisoReportesCerrado();
    if (!datosReportesCache) return;

    actualizarReporteInvestigador();

  // FIN: Actualización del reporte y perfiles por carrera

  // INICIO: Utilidades de presentación y ordenación de reportes

  function renderizarResumenReporte(id, numero, datos) {
    var metricas = [['Investigadores', numero], ['Publicaciones', datos.publicaciones.length], ['Proyectos', datos.proyectos.length], ['Eventos', datos.eventos.length]];
    document.getElementById(id).innerHTML = metricasInvestigador(metricas);
  }

  function urlReporte(valor) {
    return typeof valor === 'string' && /^https?:\/\/[^\s]+$/i.test(valor) ? valor : '';
  }

  function ordenarPublicacionesReporte(lista, orden) {
    return lista.slice().sort(function(a, b) {
      var diferencia = orden === 'fecha' ? (Date.parse(b.fecha) || 0) - (Date.parse(a.fecha) || 0) : (Number(b.hIndex) || 0) - (Number(a.hIndex) || 0);
      return diferencia || String(a.titulo).localeCompare(String(b.titulo), 'es');
    });
  }

  function fechaReporte(fecha) {
    if (!fecha || !/^\d{4}-\d{2}-\d{2}$/.test(fecha)) return 'Sin fecha';
    return fecha.split('-').reverse().join('/');
  }

  function tablaDetalleReporte(item, tipo) {
    var filas = [
      ['Descripción', item.descripcion || 'Sin descripción registrada.'],
      ['Investigador(es)', item.autores.join(', ')], ['Fecha', fechaReporte(item.fecha)],
      ['Ciclo', item.ciclo], ['Línea', item.linea], ['Estado', item.estado],
      ['Tipo', item.tipo], [tipo === 'proyectos' ? 'Financiador' : 'Participación', tipo === 'proyectos' ? item.financiador : item.rol],
      ['Lugar', item.lugar], ['Tipo de proyecto', item.tipoProyecto], ['Rol', item.rol],
      ['Modalidad', item.modalidad], ['Área temática', item.area],
      ['Presupuesto (PEN)', item.presupuesto], ['Ejecutado (PEN)', item.ejecutado], ['Avance (%)', item.avance]
    ];
    var evidencia = urlReporte(item.urlEvidencia);
    return '<div class="reporte-tabla reporte-tabla-detalle"><table><caption class="sr-only">Información del ' + (tipo === 'proyectos' ? 'proyecto' : 'evento') + '</caption><thead><tr><th scope="col">Campo</th><th scope="col">Información</th></tr></thead><tbody>' + filas.filter(function(par) {
      return par[1] != null && par[1] !== '';
    }).map(function(par) {
      return '<tr><th scope="row">' + escaparReporte(par[0]) + '</th><td>' + escaparReporte(par[1]) + '</td></tr>';
    }).join('') + '<tr><th scope="row">Evidencia</th><td>' + (evidencia ? '<a href="' + escaparReporte(evidencia) + '" target="_blank" rel="noopener noreferrer">Ver evidencia ↗</a>' : 'Sin evidencia adjunta') + '</td></tr></tbody></table></div>';
  }

  function valorCeldaOrdenReporte(celda) {
    // Usa el dato principal, sin mezclar autores, ciclo u otros metadatos.
    var copia = celda.cloneNode(true);
    copia.querySelectorAll('small, .reporte-minibarra, .tabla-orden-indicador').forEach(function(el) { el.remove(); });
    var texto = copia.textContent.trim();
    var fecha = texto.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (fecha) return { tipo: 0, valor: Number(fecha[3] + fecha[2] + fecha[1]) };
    if (/^-?\d+(?:[.,]\d+)?$/.test(texto)) return { tipo: 0, valor: Number(texto.replace(',', '.')) };
    return { tipo: texto === '—' || texto === '' ? 2 : 1, valor: texto };
  }

  function ordenarTablaReporte(tabla, columna, direccion) {
    var cuerpo = tabla.tBodies[0];
    if (!cuerpo) return;
    var filas = Array.prototype.slice.call(cuerpo.rows);
    if (filas.some(function(fila) { return !fila.cells[columna] || fila.cells[0].colSpan > 1; })) return;
    var comparador = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
    filas.sort(function(a, b) {
      var primero = valorCeldaOrdenReporte(a.cells[columna]);
      var segundo = valorCeldaOrdenReporte(b.cells[columna]);
      var diferencia = primero.tipo !== segundo.tipo ? primero.tipo - segundo.tipo :
        primero.tipo === 0 ? primero.valor - segundo.valor : comparador.compare(primero.valor, segundo.valor);
      return direccion === 'ascending' ? diferencia : -diferencia;
    });
    filas.forEach(function(fila) { cuerpo.appendChild(fila); });
    tabla.dataset.ordenColumna = String(columna);
    tabla.dataset.ordenDireccion = direccion;
    Array.prototype.forEach.call(tabla.tHead.rows[0].cells, function(cabecera, indice) {
      cabecera.setAttribute('aria-sort', indice === columna ? direccion : 'none');
      var indicador = cabecera.querySelector('.tabla-orden-indicador');
      if (indicador) indicador.textContent = indice === columna ? (direccion === 'ascending' ? '↑' : '↓') : '↕';
    });
  }

  function habilitarOrdenTablasReportes(raiz) {
    if (!raiz) return;
    raiz.querySelectorAll('table').forEach(function(tabla) {
      if (tabla.dataset.gestion === 'coleccion' || !tabla.tHead || !tabla.tHead.rows.length) return;
      Array.prototype.forEach.call(tabla.tHead.rows[0].cells, function(cabecera, columna) {
        var boton = cabecera.querySelector('.tabla-orden-boton');
        if (!boton) {
          var etiqueta = cabecera.textContent.trim();
          boton = document.createElement('button');
          boton.type = 'button';
          boton.className = 'tabla-orden-boton';
          boton.dataset.etiqueta = etiqueta;
          boton.setAttribute('aria-label', 'Ordenar por ' + etiqueta + ', ascendente o descendente');
          boton.appendChild(document.createTextNode(etiqueta));
          var indicador = document.createElement('span');
          indicador.className = 'tabla-orden-indicador';
          indicador.setAttribute('aria-hidden', 'true');
          indicador.textContent = '↕';
          boton.appendChild(indicador);
          cabecera.textContent = '';
          cabecera.setAttribute('aria-sort', 'none');
          cabecera.appendChild(boton);
        }
        // También enlaza cabeceras copiadas al diálogo mediante innerHTML.
        boton.onclick = function() {
          var direccion = tabla.dataset.ordenColumna === String(columna) && tabla.dataset.ordenDireccion === 'ascending' ? 'descending' : 'ascending';
          ordenarTablaReporte(tabla, columna, direccion);
        };
      });
      if (tabla.dataset.ordenColumna != null) ordenarTablaReporte(tabla, Number(tabla.dataset.ordenColumna), tabla.dataset.ordenDireccion);
    });
  }

  // Vista de colecciones: el estado de presentación no modifica los registros.
  var vistasColeccionInv = {};
  var dialogoColeccionInv = null;
  // FIN: Utilidades de presentación y ordenación de reportes

  // INICIO: Columnas y datos de las colecciones

  var columnasColeccionInv = {
    publicaciones: [['titulo', 'Título'], ['tipo', 'Tipo'], ['evento', 'Revista / Evento'], ['indexacion', 'Indexación'], ['calidad', 'Calidad'], ['hIndex', 'H-index'], ['fecha', 'Fecha'], ['estado', 'Estado']],
    proyectos: [['codigo', 'Código'], ['titulo', 'Título'], ['tipoProyecto', 'Tipo'], ['tipo', 'Financiamiento'], ['rol', 'Rol'], ['estado', 'Estado'], ['periodo', 'Inicio / Fin'], ['presupuesto', 'Presupuesto']],
    eventos: [['titulo', 'Evento'], ['tipo', 'Tipo'], ['rol', 'Rol'], ['modalidad', 'Modalidad'], ['fecha', 'Fecha'], ['ubicacion', 'Ubicación'], ['estado', 'Estado']]
  };

  var camposTablaColeccionInv = {
    publicaciones: [['autores', 'Autores'], ['linea', 'Línea de investigación'], ['jif', 'JIF'], ['jci', 'JCI'], ['pais', 'País'], ['ciudad', 'Ciudad'], ['urlPublicacion', 'Enlace de publicación']],
    proyectos: [['objetivos', 'Objetivos'], ['linea', 'Línea de investigación'], ['area', 'Área temática'], ['financiador', 'Entidad financiadora'], ['recursosHumanos', 'Recursos humanos'], ['ejecutado', 'Presupuesto ejecutado (PEN)'], ['resultados', 'Resultados'], ['documentosControl', 'Documentos de control'], ['actividades', 'Actividades']],
    eventos: [['urlEvento', 'Enlace del evento'], ['imagenes', 'Imágenes'], ['documentacion', 'Documentación de respaldo']]
  };

  function columnasVisiblesColeccionInv(tipo, lista) {
    var columnas = columnasColeccionInv[tipoBaseColeccionInv(tipo)].concat(camposTablaColeccionInv[tipoBaseColeccionInv(tipo)]);
    var etiquetas = { descripcion: 'Descripción', ciclo: 'Ciclo', autores: 'Investigadores', id: 'ID', lugar: 'Lugar', fecha: 'Fecha registrada', avance: 'Avance (%)', fechaInicio: 'Fecha de inicio', fechaFin: 'Fecha de fin' };
    estadoColeccionInv(tipo).datos.concat(lista || []).forEach(function(item) {
      Object.keys(item).forEach(function(clave) {
        if (clave === 'urlEvidencia') return;
        if ((clave === 'JIF' || clave === 'JCI') && columnas.some(function(par) { return par[0] === clave.toLowerCase(); })) return;
        if (!columnas.some(function(par) { return par[0] === clave; })) columnas.push([clave, etiquetas[clave] || clave]);
      });
    });
    return columnas;
  }

  function tipoBaseColeccionInv(tipo) { return tipo.replace(/^carrera-/, ''); }

  function idElementoColeccionInv(tipo, parte) {
    var carrera = tipo.indexOf('carrera-') === 0;
    return (carrera ? 'carrera-' : 'inv-') + (parte ? parte + '-' : '') + tipoBaseColeccionInv(tipo);
  }

  function idFiltroRegistroInv(pref, clave, contexto) {
    if (contexto === 'carrera') {
      var equivalencias = { 'pub-tipo': 'carrera-tipo-publicacion', 'pub-orden': 'carrera-orden', 'pro-financiamiento': 'carrera-tipo-proyecto', 'eve-estado': 'carrera-estado-evento' };
      return equivalencias[pref + '-' + clave] || 'carrera-' + pref + '-' + clave;
    }
    return 'inv-' + pref + '-' + clave;
  }

  function estadoColeccionInv(tipo) {
    if (!vistasColeccionInv[tipo]) vistasColeccionInv[tipo] = { datos: [], busqueda: '', pagina: 1, tamano: 10, columna: '', direccion: 'ascending', filtrosCabecera: {} };
    return vistasColeccionInv[tipo];
  }

  function datoColeccionInv(item, clave) {
    if (clave === 'codigo') return item.codigo || item.numeroProyecto || item.id || '';
    if (clave === 'calidad') return item.cuartil || item.rankingConferencia || item.ranking || '';
    if (clave === 'periodo') return [item.fechaInicio || item.inicio || item.fecha, item.fechaFin || item.fin].filter(Boolean).join(' / ');
    if (clave === 'ubicacion') return [item.pais, item.ciudad].filter(Boolean).join(', ') || item.lugar || '';
    if (clave === 'jif') return item.jif == null ? item.JIF : item.jif;
    if (clave === 'jci') return item.jci == null ? item.JCI : item.jci;
    return item[clave];
  }

  function textoColeccionInv(valor) {
    if (valor == null || valor === '') return 'No registrado';
    if (Array.isArray(valor)) return valor.map(textoColeccionInv).join(', ');
    if (typeof valor === 'object') return Object.keys(valor).map(function(clave) { return clave + ': ' + textoColeccionInv(valor[clave]); }).join('; ');
    return String(valor);
  }

  function normalizarBusquedaInv(valor) {
    return String(valor).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
  }

  function registrosColeccionInv(tipo) {
    var estado = estadoColeccionInv(tipo);
    var busqueda = normalizarBusquedaInv(estado.busqueda.trim());
    var lista = estado.datos.filter(function(item) {
      return !busqueda || normalizarBusquedaInv([item.titulo, item.nombre, item.codigo, item.numeroProyecto, item.id, (item.autores || []).join(' ')].join(' ')).indexOf(busqueda) !== -1;
    });
    lista = lista.filter(function(item) {
      return Object.keys(estado.filtrosCabecera).every(function(clave) {
        var seleccion = estado.filtrosCabecera[clave];
        return !seleccion.length || seleccion.indexOf(textoColeccionInv(datoColeccionInv(item, clave))) !== -1;
      });
    });
    if (!estado.columna) return lista;
    var comparador = new Intl.Collator('es', { numeric: true, sensitivity: 'base' });
    return lista.slice().sort(function(a, b) {
      var primero = datoColeccionInv(a, estado.columna);
      var segundo = datoColeccionInv(b, estado.columna);
      // Los ausentes se mantienen al final en ambos sentidos.
      if (primero == null || primero === '') return segundo == null || segundo === '' ? 0 : 1;
      if (segundo == null || segundo === '') return -1;
      var diferencia = typeof primero === 'number' && typeof segundo === 'number' ? primero - segundo : comparador.compare(textoColeccionInv(primero), textoColeccionInv(segundo));
      return estado.direccion === 'ascending' ? diferencia : -diferencia;
    });
  }

  function etiquetaEstadoInv(valor) {
    var texto = normalizarBusquedaInv(valor || 'No registrado');
    var tono = /cancelad|rechazad/.test(texto) ? 'error' : /finalizad|realizad|publicad|aceptad|aprobad/.test(texto) ? 'exito' : /desarrollo|ejecucion|revision/.test(texto) ? 'progreso' : /preparacion|programad|pendiente/.test(texto) ? 'aviso' : 'neutro';
    return '<span class="inv-estado inv-estado-' + tono + '">' + escaparReporte(valor || 'No registrado') + '</span>';
  }

  function valorDetalleColeccionInv(valor) {
    if (Array.isArray(valor)) return valor.length ? '<ul class="inv-enlaces-detalle">' + valor.map(function(item) { return '<li>' + valorDetalleColeccionInv(item) + '</li>'; }).join('') + '</ul>' : 'No registrado';
    if (valor && typeof valor === 'object') return '<dl class="inv-datos-anidados">' + Object.keys(valor).map(function(clave) { return '<div><dt>' + escaparReporte(clave) + '</dt><dd>' + valorDetalleColeccionInv(valor[clave]) + '</dd></div>'; }).join('') + '</dl>';
    var enlace = urlReporte(valor);
    return enlace ? '<a href="' + escaparReporte(enlace) + '" target="_blank" rel="noopener noreferrer">' + escaparReporte(valor) + ' ↗</a>' : escaparReporte(textoColeccionInv(valor));
  }

  function detalleColeccionInv(item, tipo) {
    var campos = {
      publicaciones: [['autores', 'Autores'], ['linea', 'Línea de investigación'], ['jif', 'JIF'], ['jci', 'JCI'], ['pais', 'País'], ['ciudad', 'Ciudad'], ['urlPublicacion', 'Enlace de publicación'], ['urlEvidencia', 'Evidencias']],
      proyectos: [['objetivos', 'Objetivos'], ['linea', 'Línea de investigación'], ['area', 'Área temática'], ['financiador', 'Entidad financiadora'], ['recursosHumanos', 'Recursos humanos'], ['ejecutado', 'Presupuesto ejecutado (PEN)'], ['resultados', 'Resultados'], ['documentosControl', 'Documentos de control'], ['actividades', 'Actividades'], ['urlEvidencia', 'Evidencias']],
      eventos: [['urlEvento', 'Enlace del evento'], ['imagenes', 'Imágenes'], ['documentacion', 'Documentación de respaldo'], ['urlEvidencia', 'Evidencias']]
    }[tipo].slice();
    var principales = columnasColeccionInv[tipoBaseColeccionInv(tipo)].map(function(par) { return par[0]; });
    Object.keys(item).forEach(function(clave) {
      if (principales.indexOf(clave) === -1 && !campos.some(function(par) { return par[0] === clave; })) campos.push([clave, { descripcion: 'Descripción', ciclo: 'Ciclo', autores: 'Investigadores', id: 'ID', lugar: 'Lugar', fecha: 'Fecha registrada', avance: 'Avance (%)', fechaInicio: 'Fecha de inicio', fechaFin: 'Fecha de fin', JIF: 'JIF', JCI: 'JCI' }[clave] || clave]);
    });
    return '<dl class="inv-detalles-grid">' + campos.map(function(par) {
      var valor = item[par[0]];
      if (par[0] === 'jif' && valor == null) valor = item.JIF;
      if (par[0] === 'jci' && valor == null) valor = item.JCI;
      return '<div><dt>' + escaparReporte(par[1]) + '</dt><dd>' + valorDetalleColeccionInv(valor) + '</dd></div>';
    }).join('') + '</dl>';
  }

  function celdaColeccionInv(item, clave) {
    var valor = datoColeccionInv(item, clave);
    if (clave === 'estado') return etiquetaEstadoInv(valor);
    if (clave === 'fecha') return valor ? escaparReporte(fechaReporte(valor)) : 'No registrado';
    if (clave === 'periodo') return escaparReporte([item.fechaInicio || item.inicio || item.fecha, item.fechaFin || item.fin].map(function(fecha) { return fecha ? fechaReporte(fecha) : 'No registrado'; }).join(' / '));
    if ((clave === 'presupuesto' || clave === 'ejecutado') && typeof valor === 'number') return escaparReporte(new Intl.NumberFormat('es-PE', { style: 'currency', currency: 'PEN' }).format(valor));
    if (valor && typeof valor === 'object' || urlReporte(valor)) return valorDetalleColeccionInv(valor);
    return escaparReporte(textoColeccionInv(valor));
  }

  var filtroCabeceraInvActual = null;

  function accionCabeceraColeccionInv(clave) {
    if (['tipo', 'tipoProyecto', 'indexacion', 'calidad', 'estado', 'rol', 'modalidad', 'linea', 'area', 'financiador', 'pais', 'ciudad', 'ciclo', 'ubicacion'].indexOf(clave) !== -1) return 'filtro';
    if (['titulo', 'codigo', 'id', 'evento', 'nombre', 'fecha', 'fechaInicio', 'fechaFin', 'periodo', 'hIndex', 'jif', 'jci', 'presupuesto', 'ejecutado', 'avance'].indexOf(clave) !== -1) return 'orden';
    return 'lectura';
  }

  function opcionesFiltroCabeceraInv(tipo, columna) {
    var prefijo = { publicaciones: 'pub', proyectos: 'pro', eventos: 'eve' }[tipoBaseColeccionInv(tipo)];
    var clave = { publicaciones: { calidad: 'cuartil' }, proyectos: { tipo: 'financiamiento' }, eventos: {} }[tipoBaseColeccionInv(tipo)][columna] || columna;
    var catalogo = (catalogosRegistrosInv[prefijo + '-' + clave] || []).slice();
    if (tipoBaseColeccionInv(tipo) === 'publicaciones' && columna === 'calidad') catalogo = catalogo.concat(catalogosRegistrosInv['pub-cuartil']);
    var valores = registrosCatalogoInv(tipoBaseColeccionInv(tipo)).map(function(item) { return textoColeccionInv(datoColeccionInv(item, columna)); });
    // Conserva valores locales y selecciones activas aunque no haya coincidencias.
    valores = valores.concat(estadoColeccionInv(tipo).datos.map(function(item) { return textoColeccionInv(datoColeccionInv(item, columna)); }));
    return unicosReporte(catalogo.concat(valores, estadoColeccionInv(tipo).filtrosCabecera[columna] || []));
  }

  // FIN: Columnas y datos de las colecciones

  // INICIO: Filtros y tablas de las colecciones

  function abrirFiltroCabeceraInv(tipo, columna) {
    filtroCabeceraInvActual = { tipo: tipo, columna: columna };
    var campos = columnasVisiblesColeccionInv(tipo, []);
    var campo = campos.find(function(par) { return par[0] === columna; });
    textoReporte('inv-columna-titulo', 'Filtrar por ' + (campo ? campo[1] : columna));
    var opciones = opcionesFiltroCabeceraInv(tipo, columna);
    var seleccion = estadoColeccionInv(tipo).filtrosCabecera[columna] || [];
    document.getElementById('inv-columna-opciones').innerHTML = '<legend class="sr-only">Valores disponibles</legend>' + (opciones.length ? opciones.map(function(valor) {
      return '<label><input type="checkbox" value="' + escaparReporte(valor) + '" onchange="aplicarFiltroCabeceraInv(this)"' + (seleccion.indexOf(valor) !== -1 ? ' checked' : '') + '><span>' + escaparReporte(valor) + '</span></label>';
    }).join('') : '<p class="reporte-nota">No hay valores disponibles para esta columna.</p>');
    document.getElementById('inv-dialogo-columna').showModal();
  }

  function aplicarFiltroCabeceraInv(control) {
    if (!filtroCabeceraInvActual) return;
    var tipo = filtroCabeceraInvActual.tipo;
    var columna = filtroCabeceraInvActual.columna;
    var estado = estadoColeccionInv(tipo);
    var seleccion = (estado.filtrosCabecera[columna] || []).filter(function(valor) { return valor !== control.value; });
    if (control.checked) seleccion.push(control.value);
    estado.filtrosCabecera[columna] = seleccion;
    estado.pagina = 1;
    renderizarColeccionInv(tipo);
  }

  function limpiarFiltroCabeceraInv() {
    if (!filtroCabeceraInvActual) return;
    var tipo = filtroCabeceraInvActual.tipo;
    estadoColeccionInv(tipo).filtrosCabecera[filtroCabeceraInvActual.columna] = [];
    estadoColeccionInv(tipo).pagina = 1;
    document.querySelectorAll('#inv-columna-opciones input').forEach(function(control) { control.checked = false; });
    renderizarColeccionInv(tipo);
  }

  function tablaColeccionInv(tipo, lista, contexto, inicio, completa) {
    var columnas = columnasVisiblesColeccionInv(tipo, lista);
    var estado = estadoColeccionInv(tipo);
    return '<table data-gestion="coleccion"><caption class="sr-only">' + escaparReporte(tipo) + '</caption><thead><tr>' + columnas.map(function(par) {
      var accion = accionCabeceraColeccionInv(par[0]);
      var activa = estado.columna === par[0];
      var orden = activa ? estado.direccion : 'none';
      var seleccion = estado.filtrosCabecera[par[0]] || [];
      var cabecera = escaparReporte(par[1]);
      if (!completa && accion !== 'lectura') {
        var filtrar = accion === 'filtro';
        var etiqueta = (filtrar ? 'Filtrar por ' : 'Ordenar por ') + par[1] + (seleccion.length ? ', ' + seleccion.length + ' valores seleccionados' : '');
        cabecera = '<button type="button" class="tabla-orden-boton' + (seleccion.length ? ' inv-columna-filtrada' : '') + '" data-tipo="' + tipo + '" data-columna="' + escaparReporte(par[0]) + '" data-etiqueta="' + escaparReporte(par[1]) + '" aria-label="' + escaparReporte(etiqueta) + '"' + (filtrar ? ' aria-haspopup="dialog" aria-controls="inv-dialogo-columna"' : '') + ' onclick="' + (filtrar ? 'abrirFiltroCabeceraInv' : 'ordenarColeccionInv') + '(this.dataset.tipo,this.dataset.columna)">' + cabecera + (filtrar ? '<i class="fa-solid fa-filter" aria-hidden="true"></i>' : '<span class="tabla-orden-indicador" aria-hidden="true">' + (activa ? orden === 'ascending' ? '↑' : '↓' : '↕') + '</span>') + '</button>';
      }
      return '<th scope="col"' + (accion === 'orden' ? ' aria-sort="' + orden + '"' : '') + '>' + cabecera + '</th>';
    }).join('') + '<th scope="col">Acciones</th></tr></thead><tbody' + (tipoBaseColeccionInv(tipo) === 'publicaciones' && contexto === 'principal' ? ' id="' + (tipo.indexOf('carrera-') === 0 ? 'carrera-publicaciones-body' : 'tabla-publicaciones-body') + '"' : '') + '>' + (lista.length ? lista.map(function(item) {
      var enlace = urlReporte(item.urlEvidencia);
      return '<tr>' + columnas.map(function(par) { return '<td>' + celdaColeccionInv(item, par[0]) + '</td>'; }).join('') + '<td class="inv-acciones-registro">' + (enlace ? '<a href="' + escaparReporte(enlace) + '" target="_blank" rel="noopener noreferrer">Ver evidencia ↗</a>' : '<small>Sin evidencia adjunta</small>') + '</td></tr>';
    }).join('') : '<tr><td colspan="' + (columnas.length + 1) + '" class="reporte-vacio">No hay ' + tipoBaseColeccionInv(tipo) + ' que coincidan con la búsqueda y los filtros.</td></tr>') + '</tbody></table>';
  }

  function alternarDetalleColeccionInv(boton) {
    var fila = document.getElementById(boton.getAttribute('aria-controls'));
    var mostrar = boton.getAttribute('aria-expanded') !== 'true';
    fila.classList.toggle('hidden', !mostrar);
    boton.setAttribute('aria-expanded', String(mostrar));
    boton.textContent = mostrar ? 'Ocultar detalles' : 'Ver detalles';
  }

  // FIN: Filtros y tablas de las colecciones

  // INICIO: Búsqueda, paginación y exportación de colecciones

  function prepararColeccionesInv(datos, contexto) {
    Object.keys(columnasColeccionInv).forEach(function(base) {
      var tipo = contexto === 'carrera' ? 'carrera-' + base : base;
      var estado = estadoColeccionInv(tipo);
      var ordenBase = valorReporte(idFiltroRegistroInv({ publicaciones: 'pub', proyectos: 'pro', eventos: 'eve' }[base], 'orden', contexto));
      if (estado.ordenBase !== ordenBase) estado.columna = '';
      estado.ordenBase = ordenBase;
      estado.datos = datos[base];
      estado.pagina = 1;
      renderizarColeccionInv(tipo);
    });
  }

  function paginaColeccionInv(tipo) {
    var estado = estadoColeccionInv(tipo);
    var lista = registrosColeccionInv(tipo);
    var paginas = Math.max(1, Math.ceil(lista.length / estado.tamano));
    estado.pagina = Math.max(1, Math.min(estado.pagina, paginas));
    var inicio = (estado.pagina - 1) * estado.tamano;
    return { lista: lista, visibles: lista.slice(inicio, inicio + estado.tamano), inicio: inicio, paginas: paginas };
  }

  function pieColeccionInv(tipo, pagina) {
    var estado = estadoColeccionInv(tipo);
    return '<div class="inv-paginacion"><button type="button" aria-label="Página anterior" title="Página anterior" onclick="cambiarPaginaColeccionInv(\'' + tipo + '\',-1)"' + (estado.pagina === 1 ? ' disabled' : '') + '><i class="fa-solid fa-chevron-left" aria-hidden="true"></i></button><span aria-label="Página ' + estado.pagina + ' de ' + pagina.paginas + '">' + estado.pagina + ' / ' + pagina.paginas + '</span><button type="button" aria-label="Página siguiente" title="Página siguiente" onclick="cambiarPaginaColeccionInv(\'' + tipo + '\',1)"' + (estado.pagina === pagina.paginas ? ' disabled' : '') + '><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button></div>';
  }

  function renderizarColeccionInv(tipo) {
    var pagina = paginaColeccionInv(tipo);
    var contenedor = document.getElementById(idElementoColeccionInv(tipo));
    if (tipoBaseColeccionInv(tipo) === 'publicaciones') contenedor.innerHTML = tablaColeccionInv(tipo, pagina.visibles, 'principal', pagina.inicio, false);
    else contenedor.innerHTML = pagina.visibles.length ? pagina.visibles.map(function(item, indice) {
      return '<article class="reporte-detalle"><button type="button" class="reporte-abrir-detalle" aria-haspopup="dialog" aria-controls="reporte-dialogo-detalle" onclick="abrirColeccionInv(\'' + tipo + '\',' + (pagina.inicio + indice) + ')"><span><strong>' + escaparReporte(item.titulo || item.nombre || 'Sin título') + '</strong><small>' + escaparReporte(textoColeccionInv(datoColeccionInv(item, tipoBaseColeccionInv(tipo) === 'proyectos' ? 'codigo' : 'tipo'))) + ' · ' + escaparReporte(fechaReporte(item.fecha)) + '</small>' + etiquetaEstadoInv(item.estado) + '</span><i class="fa-solid fa-chevron-right" aria-hidden="true"></i></button></article>';
    }).join('') : '<p class="reporte-vacio">No hay ' + tipoBaseColeccionInv(tipo) + ' que coincidan con la búsqueda y los filtros.</p>';
    var filtrosActivos = Object.keys(estadoColeccionInv(tipo).filtrosCabecera).filter(function(clave) { return estadoColeccionInv(tipo).filtrosCabecera[clave].length; }).length;
    document.getElementById(idElementoColeccionInv(tipo, 'contador')).textContent = pagina.lista.length + (pagina.lista.length === 1 ? ' resultado encontrado' : ' resultados encontrados') + (filtrosActivos ? ' · ' + filtrosActivos + ' filtros de columna' : '');
    document.getElementById(idElementoColeccionInv(tipo, 'pie')).innerHTML = pieColeccionInv(tipo, pagina);
    if (dialogoColeccionInv && dialogoColeccionInv.tipo === tipo && document.getElementById('reporte-dialogo-detalle').open) renderizarDialogoColeccionInv();
  }

  function buscarColeccionInv(tipo, valor) {
    var estado = estadoColeccionInv(tipo);
    estado.busqueda = valor;
    estado.pagina = 1;
    renderizarColeccionInv(tipo);
  }

  function tamanoColeccionInv(tipo, valor) {
    var estado = estadoColeccionInv(tipo);
    estado.tamano = [10, 25, 50].indexOf(Number(valor)) === -1 ? 10 : Number(valor);
    estado.pagina = 1;
    renderizarColeccionInv(tipo);
  }

  function cambiarPaginaColeccionInv(tipo, cambio) {
    estadoColeccionInv(tipo).pagina += cambio;
    renderizarColeccionInv(tipo);
  }

  function ordenarColeccionInv(tipo, columna) {
    var activo = document.activeElement;
    var enDialogo = activo && document.getElementById('reporte-dialogo-detalle').contains(activo);
    var estado = estadoColeccionInv(tipo);
    estado.direccion = estado.columna === columna && estado.direccion === 'ascending' ? 'descending' : 'ascending';
    estado.columna = columna;
    estado.pagina = 1;
    renderizarColeccionInv(tipo);
    var raiz = document.getElementById(enDialogo ? 'reporte-detalle-contenido' : idElementoColeccionInv(tipo));
    var boton = Array.prototype.find.call(raiz.querySelectorAll('[data-columna]'), function(el) { return el.dataset.columna === columna; });
    if (boton) boton.focus({ preventScroll: true });
  }

  function abrirColeccionInv(tipo, indice) {
    dialogoColeccionInv = { tipo: tipo, item: typeof indice === 'number' ? registrosColeccionInv(tipo)[indice] : null };
    renderizarDialogoColeccionInv();
    document.getElementById('reporte-dialogo-detalle').showModal();
  }

  function renderizarDialogoColeccionInv() {
    var tipo = dialogoColeccionInv.tipo;
    var pagina = paginaColeccionInv(tipo);
    var item = dialogoColeccionInv.item;
    textoReporte('reporte-detalle-titulo', item ? item.titulo : 'Tabla de ' + tipoBaseColeccionInv(tipo));
    document.getElementById('reporte-detalle-contenido').innerHTML = '<div class="reporte-tabla" tabindex="0" role="region" aria-label="Tabla de ' + tipo + '">' + tablaColeccionInv(tipo, item ? [item] : pagina.visibles, 'dialogo', pagina.inicio, false) + '</div>' + (item ? '' : '<div class="inv-pie-coleccion">' + pieColeccionInv(tipo, pagina) + '</div>');
  }

  function csvColeccionInv(tipo) {
    var lista = registrosColeccionInv(tipo);
    var campos = columnasVisiblesColeccionInv(tipo, lista).map(function(par) { return par[0]; });
    lista.forEach(function(item) { Object.keys(item).forEach(function(clave) { if (campos.indexOf(clave) === -1) campos.push(clave); }); });
    function celda(valor) {
      var texto = valor == null ? '' : typeof valor === 'object' ? JSON.stringify(valor) : String(valor);
      if (/^[=+@\-\t\r]/.test(texto)) texto = "'" + texto;
      return '"' + texto.replace(/"/g, '""') + '"';
    }
    var nombres = {};
    columnasVisiblesColeccionInv(tipo, lista).forEach(function(par) { nombres[par[0]] = par[1]; });
    return '\uFEFF' + [campos.map(function(clave) { return celda(nombres[clave] || clave); }).join(',')].concat(lista.map(function(item) { return campos.map(function(clave) { return celda(datoColeccionInv(item, clave)); }).join(','); })).join('\r\n');
  }

  function exportarColeccionInv(tipo) {
    var url = URL.createObjectURL(new Blob([csvColeccionInv(tipo)], { type: 'text/csv;charset=utf-8' }));
    var enlace = document.createElement('a');
    enlace.href = url;
    enlace.download = 'empiria-' + tipo + '.csv';
    document.body.appendChild(enlace);
    enlace.click();
    enlace.remove();
    setTimeout(function() { URL.revokeObjectURL(url); }, 1000);
    document.getElementById(idElementoColeccionInv(tipo, 'contador')).textContent = registrosColeccionInv(tipo).length + ' registros exportados a CSV';
  }

  function renderizarProduccionReporte(prefijo, datos) {
    prepararColeccionesInv(datos, prefijo === 'carrera' ? 'carrera' : 'investigador');
  }

  // FIN: Búsqueda, paginación y exportación de colecciones

  // INICIO: Clasificación y filtros del reporte por investigador

  function valorRenacytReporte(nivel) {
    var niveles = { 'Distinguido': 8, 'Nivel I': 7, 'Nivel II': 6, 'Nivel III': 5, 'Nivel IV': 4, 'Nivel V': 3, 'Nivel VI': 2, 'Nivel VII': 1 };
    return niveles[nivel] || 0;
  }

  var filtrosGeneralesInv = { carrera: 'carrera', linea: 'lineas', categoria: 'categoria', dedicacion: 'dedicacion', dia: 'dias', grupoRenacyt: 'renacytGrupo', nivel: 'renacytNivel', grupo: 'grupos', semillero: 'semilleros' };
  var camposRegistrosInv = {
    pub: { tipo: 'tipo', estado: 'estado', indexacion: 'indexacion', cuartil: 'cuartil', ranking: 'rankingConferencia', lugar: 'lugar' },
    pro: { financiamiento: 'tipo', estado: 'estado', tipoProyecto: 'tipoProyecto', rol: 'rol', financiador: 'financiador', area: 'area' },
    eve: { estado: 'estado', tipo: 'tipo', modalidad: 'modalidad', rol: 'rol', lugar: 'lugar' }
  };

  function iniciarFiltrosInvestigador() {
    Object.keys(filtrosGeneralesInv).forEach(function(clave) {
      var valores = [];
      investigadoresReporte().forEach(function(inv) {
        var valor = clave === 'linea' ? lineasInvestigador(inv) : inv[filtrosGeneralesInv[clave]];
        valores = valores.concat(valor || []);
      });
      llenarSelectReporte('inv-filtro-' + clave, unicosReporte(valores), 'Todos');
    });
    var ciclos = [];
    investigadoresReporte().forEach(function(inv) {
      ['publicaciones', 'proyectos', 'eventos', 'entregas'].forEach(function(campo) {
        (inv[campo] || []).forEach(function(item) { if (item.ciclo) ciclos.push(item.ciclo); });
      });
    });
    ciclos.push(cicloReporte());
    llenarSelectReporte('inv-ciclo', unicosReporte(ciclos).sort().reverse());
    document.getElementById('inv-ciclo').value = cicloReporte();
  }

  function sincronizarCicloInvestigador() {
    var ciclo = valorReporte('inv-ciclo');
    // El estado proviene del selector global; un ciclo sin registro se trata como cerrado.
    var opcion = document.querySelector('#ciclo-dropdown [data-ciclo="' + ciclo + '"]');
    selectCiclo(ciclo, opcion && /ACTIVO/.test(opcion.textContent) ? 'ACTIVO' : 'CERRADO');
  }

  function filtrarInvestigadoresReporte() {
    var lista = investigadoresReporte().filter(function(inv) {
      return Object.keys(filtrosGeneralesInv).every(function(clave) {
        var filtro = valorReporte('inv-filtro-' + clave);
        var valor = clave === 'linea' ? lineasInvestigador(inv) : inv[filtrosGeneralesInv[clave]];
        return !filtro || (Array.isArray(valor) ? valor.indexOf(filtro) !== -1 : valor === filtro);
      });
    });
    llenarSelectReporte('select-investigador', lista.map(function(inv) { return { valor: inv.id, texto: inv.nombre + ' · ID ' + inv.id }; }));
    cargarDatosInvestigador();
  }

  function datosPeriodoInvestigador(inv, todosCiclos) {
    var datos = {};
    var ciclo = cicloReporte();
    var anual = valorReporte('inv-periodo') === 'año';
    var linea = valorReporte('inv-filtro-linea');
    ['publicaciones', 'proyectos', 'eventos', 'entregas'].forEach(function(campo) {
      datos[campo] = registrosReporte(inv ? [inv] : [], campo, linea, '').filter(function(item) {
        return todosCiclos || (anual ? String(item.ciclo).slice(0, 10) === ciclo.slice(0, 10) : item.ciclo === ciclo);
      });
    });
    return datos;
  }

  var catalogosRegistrosInv = {
    'pub-tipo': ['Journal', 'Conferencia', 'Editor', 'Otro'],
    'pub-estado': ['En preparación', 'En revisión', 'Aceptado', 'Publicado', 'Rechazado'],
    'pub-indexacion': ['Scopus', 'WoS', 'Otras', 'Sin indexación'],
    'pub-cuartil': ['Q1', 'Q2', 'Q3', 'Q4'],
    'pro-financiamiento': ['Interno', 'Externo'],
    'pro-estado': ['Aprobado', 'En desarrollo', 'Finalizado'],
    'pro-tipoProyecto': ['Investigación básica', 'Investigación aplicada'],
    'pro-rol': ['Principal', 'Responsable', 'Integrante'],
    'eve-estado': ['Realizado', 'Programado', 'Cancelado'],
    'eve-tipo': ['Conferencia', 'Congreso', 'Taller', 'Revisión', 'Seminario', 'Simposio', 'Jornada', 'Curso', 'Otro'],
    'eve-modalidad': ['Virtual', 'Presencial', 'Híbrida', 'Otra'],
    'eve-rol': ['Expositor', 'Ponente', 'Organizador', 'Revisor', 'Asistente']
  };

  function registrosCatalogoInv(tipo) {
    // El catálogo no depende del investigador, ciclo, búsqueda o página visibles.
    return registrosReporte(investigadoresReporte(), tipo, '', '');
  }

  function prepararFiltrosRegistrosInv(datos, contexto) {
    ['pub', 'pro', 'eve'].forEach(function(pref, indice) {
      var registros = registrosCatalogoInv(['publicaciones', 'proyectos', 'eventos'][indice]);
      Object.keys(camposRegistrosInv[pref]).forEach(function(clave) {
        var valores = registros.map(function(item) { return item[camposRegistrosInv[pref][clave]]; }).filter(Boolean);
        llenarSelectReporte(idFiltroRegistroInv(pref, clave, contexto), unicosReporte(valores.concat(catalogosRegistrosInv[pref + '-' + clave] || [])), 'Todos');
      });
    });
  }

  function filtrarRegistrosInv(lista, pref, contexto) {
    var campoNumero = pref === 'pub' ? 'hIndex' : 'presupuesto';
    return lista.filter(function(item) {
      var coincide = Object.keys(camposRegistrosInv[pref]).every(function(clave) {
        return !valorReporte(idFiltroRegistroInv(pref, clave, contexto)) || item[camposRegistrosInv[pref][clave]] === valorReporte(idFiltroRegistroInv(pref, clave, contexto));
      });
      var evidencia = valorReporte(idFiltroRegistroInv(pref, 'evidencia', contexto));
      if (evidencia && Boolean(urlReporte(item.urlEvidencia)) !== (evidencia === 'si')) return false;
      if (pref !== 'eve') {
        var minimo = valorReporte(idFiltroRegistroInv(pref, 'min', contexto));
        var maximo = valorReporte(idFiltroRegistroInv(pref, 'max', contexto));
        if ((minimo !== '' || maximo !== '') && item[campoNumero] == null) return false;
        if (minimo !== '' && Number(item[campoNumero]) < Number(minimo)) return false;
        if (maximo !== '' && Number(item[campoNumero]) > Number(maximo)) return false;
      }
      return coincide;
    }).sort(function(a, b) {
      var orden = valorReporte(idFiltroRegistroInv(pref, 'orden', contexto));
      if (orden === 'cuartil') return String(a.cuartil || 'Z').localeCompare(String(b.cuartil || 'Z'));
      if (orden === 'fecha') return (Date.parse(b.fecha) || 0) - (Date.parse(a.fecha) || 0);
      var campo = orden === 'impacto' ? 'hIndex' : orden;
      return (Number(b[campo]) || 0) - (Number(a[campo]) || 0);
    });
  }

  function metricasInvestigador(pares) {
    return '<div class="reporte-metricas">' + pares.map(function(par, indice) {
      var ranking = par[0] === 'Posición en el ranking general';
      var partes = ranking ? String(par[1]).match(/^(\d+) de (\d+)$/) : null;
      var cercania = partes ? (Number(partes[2]) - Number(partes[1])) / Math.max(1, Number(partes[2]) - 1) : 0;
      var acabado = !partes ? 'ranking-sin-datos' : Number(partes[1]) === 1 ? 'ranking-oro' : cercania >= .75 ? 'ranking-dorado' : cercania >= .4 ? 'ranking-champan' : 'ranking-neutro';
      var valor = partes ? '<b class="ranking-posicion">' + partes[1] + '</b><small class="ranking-total"> de ' + partes[2] + '</small>' : escaparReporte(par[1]);
      return '<div class="glass-card reporte-metrica metrica-tono-' + (indice % 5) + (ranking ? ' metrica-ranking ' + acabado : '') + '"><span>' + escaparReporte(par[0]) + '</span><strong>' + valor + '</strong></div>';
    }).join('') + '</div>';
  }

  function calidadInvestigador(publicaciones) {
    var lista = publicaciones.filter(function(p) { return numeroEstadistica(p.hIndex) != null; });
    return lista.length ? lista.reduce(function(suma, p) { return suma + Number(p.hIndex); }, 0) / lista.length : null;
  }

  function abrirFiltrosInvestigador(seccion) {

    if (dialogo) dialogo.showModal();
  }

  // FA-003 (pasos 7 y 8) y FA-014 de CU-005: «Restablecer» elimina los criterios de la
  // colección (diálogo, búsqueda y filtros de columna); «Cerrar» los conserva (FA-020).
  function restablecerFiltrosColeccion(tipo) {
    var carrera = tipo.indexOf('carrera-') === 0;
    var dialogo = document.getElementById((carrera ? 'carrera' : 'inv') + '-dialogo-' + tipoBaseColeccionInv(tipo));
    dialogo.querySelectorAll('select, input').forEach(function(control) {
      control.value = control.tagName === 'SELECT' ? control.options[0].value : '';
    });
    var estado = estadoColeccionInv(tipo);
    estado.busqueda = '';
    estado.filtrosCabecera = {};
    document.getElementById(idElementoColeccionInv(tipo, 'buscar')).value = '';
    if (carrera) actualizarReporteCarrera(); else actualizarReporteInvestigador();
  }

  function actualizarReporteInvestigador() {
    var inv = investigadoresReporte().find(function(item) { return item.id === valorReporte('select-investigador'); });
    var datos = datosPeriodoInvestigador(inv);
    prepararFiltrosRegistrosInv(datos);
    var pub = datos.publicaciones;
    renderizarProduccionReporte('inv', { publicaciones: filtrarRegistrosInv(pub, 'pub'), proyectos: filtrarRegistrosInv(datos.proyectos, 'pro'), eventos: filtrarRegistrosInv(datos.eventos, 'eve') });
    renderizarEstadisticasInvestigador(inv, datos);
    renderizarGraficosInvestigador(datos);
  }

  function renderizarEstadisticasInvestigador(inv, datos) {
    var destino = document.getElementById('inv-estadisticas');
    // FA-009 de CU-005: sin investigador compatible se muestran conteos en cero.

    var comparables = investigadoresReporte().map(function(persona) {

  function agruparReporte(lista, campo) {

  function renderizarColumnasCarrera(id, grupos, unidad) {

  function renderizarPastelReporte(id, grupos, unidad) {
