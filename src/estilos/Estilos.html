  /* INICIO: Variables de diseño y estilos base */

  * { box-sizing: border-box; }

  }

  .boton-primario:hover, #btn-asignar-tarea:hover { background: var(--primario-hover); border-color: var(--primario-hover); }
  #btn-asignar-tarea i { color: var(--texto-inverso); }

  #view-tareas { justify-content: flex-start; }

  .filtro-pill:hover { border-color: var(--borde); }
  .filtro-pill.active { background: var(--primario-suave); border-color: var(--primario-suave); color: var(--primario); font-weight: 600; }

  #view-reportes .boton-primario:hover { background: var(--primario-hover); }

  #view-login > .glass-card > div:first-child { width: 64px; height: 64px; background: var(--primario-suave); border-color: var(--primario-suave); box-shadow: none; }
  #view-login .fa-graduation-cap { color: var(--primario); font-size: 28px; }
  #view-login button { border-radius: var(--radio-control); box-shadow: var(--sombra); }
  #view-login button:hover { border-color: var(--borde); }

  #modal-exito > div, #modal-crear-plantilla > div { max-height: calc(100dvh - 32px); overflow-y: auto; border-color: var(--borde); }
  .fade-in { animation: fadeIn .2s ease-out; }

  .acceso-modulo { display: flex; align-items: center; justify-content: space-between; padding: 20px; text-align: left; gap: 16px; }

  .acceso-modulo strong, .acceso-modulo small { display: block; }
  .acceso-modulo small { margin-top: 6px; color: var(--secundario); font-size: var(--tipo-nota); font-weight: 400; }
  @media (max-width: 1023px) {

  @media (max-width: 767px) {

  /* INICIO: Submódulos de reportes: selectores, fichas y visualización de datos. */

  /* Submódulos de reportes: selectores, fichas y visualización de datos. */
  .reporte-seccion { display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  #view-reportes h2 { font-size: 24px; font-weight: 700; }
  #view-reportes h3, #view-reportes .grid > section.glass-card h3 { font-size: var(--tipo-seccion); font-weight: 600; }
  .reporte-seccion p { font-size: var(--tipo-nota); color: var(--secundario); margin-top: 6px; }
  .reporte-eyebrow { color: var(--primario) !important; font-size: var(--tipo-nota) !important; font-weight: 700; letter-spacing: .1em; margin: 0 0 6px !important; }
  .reporte-exportar { padding: 12px 16px; font-size: var(--tipo-nota); flex-shrink: 0; }
  .reporte-tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--borde); }
  #view-reportes .reporte-tabs button { background: transparent; color: var(--secundario); border: 0; border-bottom: 3px solid transparent; border-radius: 0; padding: 14px 4px; font-size: 13px; font-weight: 600; text-align: left; }
  #view-reportes .reporte-tabs button i { margin-right: 8px; }
  #view-reportes .reporte-tabs button[aria-selected="true"] { color: var(--primario); border-bottom-color: var(--primario); }
  #view-reportes .reporte-tabs button:hover { color: var(--primario); background: var(--primario-suave); }
  #view-reportes #reintentar-reportes { background: var(--superficie); color: var(--primario); border-color: var(--primario-suave); }
  .reporte-nota { color: var(--secundario); font-size: var(--tipo-nota); line-height: 1.7; }

  /* Mensaje ampliado de error en la carga de reportes (FA-012 / FA-013 de CU-005). */
  .reporte-nota.reporte-alerta { color: var(--error); background: var(--error-suave); border: 1px solid var(--error); border-radius: 10px; padding: 14px 16px; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .reporte-filtros { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; }
  .reporte-campo { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .reporte-campo > span { font-size: var(--tipo-nota); color: var(--secundario); font-weight: 600; }
  .reporte-campo select { width: 100%; min-width: 0; min-height: 42px; padding: 10px 32px 10px 12px; border: 1px solid var(--primario-suave); border-radius: var(--radio-control); color: var(--texto); background: var(--superficie); font-size: var(--tipo-nota); text-overflow: ellipsis; }
  .reporte-campo select:disabled { opacity: .6; cursor: not-allowed; background: var(--fondo); }
  .reporte-ficha { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 24px; background: var(--superficie); padding: 24px; border: 1px solid var(--primario-suave); border-radius: 12px; }
  .reporte-ficha > div { min-width: 0; overflow-wrap: anywhere; }
  .reporte-ficha p { font-size: var(--tipo-nota); color: var(--secundario); margin-top: 8px; }
  .reporte-etiqueta { display: block; text-transform: uppercase; color: var(--primario); font-size: var(--tipo-nota); letter-spacing: .06em; font-weight: 600; margin-bottom: 12px; }
  .reporte-dias { display: flex; gap: 6px; margin-top: 16px; }
  .reporte-dias > span { min-width: 30px; height: 30px; padding: 0 6px; display: grid; place-items: center; border-radius: 6px; background: var(--primario-suave); color: var(--secundario); font-size: var(--tipo-nota); }
  .reporte-dias > .dia-activo { background: var(--primario); color: var(--texto-inverso); font-weight: 700; }
  .reporte-metricas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .reporte-metrica { padding: 20px; }
  .reporte-metrica > span { display: block; font-size: var(--tipo-nota); color: var(--secundario); }
  .reporte-metrica > strong { display: block; font-size: var(--tipo-indicador); font-weight: 700; margin-top: 8px; letter-spacing: -.03em; }
  .reporte-tabla { border: 1px solid var(--borde); border-radius: 10px; overflow-x: auto; }
  .reporte-tabla table { width: 100%; text-align: left; font-size: var(--tipo-nota); border-collapse: collapse; }
  .reporte-tabla thead { background: var(--superficie); }
  .reporte-tabla tbody tr + tr { border-top: 1px solid var(--borde); }
  .reporte-tabla small, .reporte-detalle small { display: block; color: var(--secundario); font-size: var(--tipo-nota); margin-top: 6px; }
  .reporte-tabla td { vertical-align: top; }
  .reporte-vacio { color: var(--secundario); text-align: center; padding: 28px 12px; font-size: var(--tipo-nota); }
  /* FA-014 de CU-005: en tablas anchas el estado vacío debe verse sin desplazar. */
  td.reporte-vacio { text-align: left; }
  .reporte-listado { display: flex; flex-direction: column; gap: 10px; }
